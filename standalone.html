      if (!monthStr) return getCurrentMonthString();
      const parts = monthStr.trim().split(' ');
      const mName = parts[0];
      let year = parseInt(parts[1], 10) || new Date().getFullYear();
      let idx = UZ_MONTHS.indexOf(mName);
      if (idx === -1) idx = new Date().getMonth();
      idx += 1;
      if (idx >= 12) {
        idx = 0;
        year += 1;
      }
      return `${UZ_MONTHS[idx]} ${year}`;

      workbook.creator = 'EduFinance CRM';

        { header: 'Izoh', key: 'note', width: 30 }
      ];
      wsP.getRow(1).eachCell(c => { c.fill = headerFill; c.font = headerFont; });

      payments.forEach((p, idx) => {

        let statusText = p.isPrepaid ? "Oldindan to'langan" : p.is3MonthPayment ? "3 Oylik (To'liq)" : (Number(p.naqd || 0) + Number(p.click || 0) <= 0) ? "Qarzdor" : "To'ladi";

CREATE TABLE IF NOT EXISTS users (

  password TEXT NOT NULL,
  full_name TEXT NOT NULL,
  role TEXT DEFAULT 'admin',
  phone TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()

ALTER TABLE users DISABLE ROW LEVEL SECURITY;

-- 1. Guruhlar jadvali
CREATE TABLE IF NOT EXISTS groups (
  id TEXT PRIMARY KEY,
  name TEXT NOT NULL,
  category TEXT,
  fee NUMERIC DEFAULT 0,
  teacher TEXT,
  days TEXT,
  room TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. Studentlar (O'quvchilar) jadvali
CREATE TABLE IF NOT EXISTS students (
  id TEXT PRIMARY KEY,
  name TEXT NOT NULL,
  phone TEXT,
  parent_phone TEXT,
  "group" TEXT,
  monthly_fee NUMERIC DEFAULT 0,
  status TEXT DEFAULT 'active',
  joined_date DATE DEFAULT CURRENT_DATE,

);

-- 3. To'lovlar (Tushum) jadvali
CREATE TABLE IF NOT EXISTS payments (
  id TEXT PRIMARY KEY,
  student_id TEXT,
  student_name TEXT NOT NULL,
  phone_student TEXT,
  phone_parent TEXT,
  oylik_tolov NUMERIC DEFAULT 0,
  naqd NUMERIC DEFAULT 0,

  bitta_toliq_summa NUMERIC DEFAULT 0,
  depozit_balansi NUMERIC DEFAULT 0,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 4. Harajatlar jadvali
CREATE TABLE IF NOT EXISTS expenses (
  id TEXT PRIMARY KEY,
  category TEXT NOT NULL,
  description TEXT NOT NULL,
  amount NUMERIC NOT NULL,
  recipient TEXT,
  date DATE DEFAULT CURRENT_DATE,
  month TEXT NOT NULL,

);

-- 5. Oylar ro'yxati jadvali
CREATE TABLE IF NOT EXISTS months (
  name TEXT PRIMARY KEY,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- RLS (Row Level Security) ni o'chirish (Anon key orqali to'g'ridan-to'g'ri o'qish/yozish ruxsati uchun):
ALTER TABLE groups DISABLE ROW LEVEL SECURITY;
ALTER TABLE students DISABLE ROW LEVEL SECURITY;
ALTER TABLE payments DISABLE ROW LEVEL SECURITY;
ALTER TABLE expenses DISABLE ROW LEVEL SECURITY;

        setIsSyncing(true);

              pullSuccess = true;

              setPayments(pData.map(p => ({

      // ==========================================

      // Automatic initial connection and sync with Supabase (Independent per-table loader)
      useEffect(() => {

        let isMounted = true;
        const autoSyncOnStartup = async () => {

      }, [supabase]);


      // 1-Click: Add next sequential month

        deleteMonthFromSupabase(m);
        setPayments(prev => prev.filter(p => p.month !== m));

        if (selectedMonth === m) {

          setSelectedMonth(fallback);
        }

        setMonthToDeleteConfirm(null);
        showToast(`"${m}" oyi muvaffaqiyatli o'chirildi!`);
      };

      // Rollover students from database into target month
      const handleRolloverStudents = (targetMonth) => {
        const activeStudents = students.filter(s => s.status === 'active');
        if (activeStudents.length === 0) {
          showToast("Faol o'quvchilar ro'yxati bo'sh! Avval 'O'quvchilar' bo'limida o'quvchi qo'shing.");
          return;
        }

        const existingInTarget = payments.filter(p => p.month === targetMonth);
        let addedCount = 0;
        const newRecords = [];

        activeStudents.forEach(stu => {
          const alreadyExists = existingInTarget.some(
            p => (p.studentId && p.studentId === stu.id) ||
                 (p.studentName.trim().toLowerCase() === stu.name.trim().toLowerCase() &&
                  (p.group || '').trim().toLowerCase() === (stu.group || '').trim().toLowerCase())
          );

          if (!alreadyExists) {
            newRecords.push({
              id: `PAY-${1000 + payments.length + newRecords.length + 1}`,
              studentId: stu.id,
              studentName: stu.name,
              phoneStudent: stu.phone,
              phoneParent: stu.parentPhone,
              oylikTolov: Number(stu.monthlyFee || 750000),

              depozitBalansi: 0,
              naqd2: 0,

            });

      // Autocomplete Search Matches for Payment Modal
      const studentMatches = useMemo(() => {
        if (!studentQuery.trim()) return [];
        const q = studentQuery.toLowerCase().trim();
        return students.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.id.toLowerCase().includes(q) ||
          (s.phone && s.phone.includes(q))
        ).slice(0, 6);
      }, [students, studentQuery]);

      // Select student from Autocomplete
      const handleSelectStudent = (stu) => {
        setFormData(prev => ({
          ...prev,
          studentId: stu.id,
          studentName: stu.name,

      // Save or Update Student
      const handleSaveStudent = (e) => {

      // Delete Student

          };

        }
        setIsGroupModalOpen(false);
      };

      // Delete Group
      const handleDeleteGroup = (id) => {
        if (window.confirm("Bu guruhni o'chirmoqchimisiz?")) {
          setGroups(prev => prev.filter(g => g.id !== id));
          showToast("Guruh o'chirildi");
        }
      };

      // Delete Payment
      const handleDeletePayment = (id) => {
        if (window.confirm("Haqiqatan ham bu to'lov yozuvini o'chirmoqchimisiz?")) {
          setPayments(prev => prev.filter(p => p.id !== id));
          showToast("To'lov o'chirildi");
        }
      };

      // Quick Pay handler
      const handleQuickPay = (p) => {
        setFormData({
          studentId: p.studentId || '',
          studentName: p.studentName,
          phoneStudent: p.phoneStudent || '+998 ',
          phoneParent: p.phoneParent || '+998 ',
          oylikTolov: Number(p.oylikTolov || 750000),
          naqd: 0,
          click: Number(p.oylikTolov || 750000),
          group: p.group || groups[0]?.name || 'Frontend ReactJS (A1)',
          paymentDate: getTodayInputFormat(),
          month: p.month,
          paymentType: 'Click',
          note: '',
          is3MonthPayment: false,
          bittaToliqSumma: 0,
          depozitBalansi: 0
        });
        setStudentQuery(p.studentName + (p.studentId ? ` (${p.studentId})` : ''));
        setIsModalOpen(true);
      };

      // Save Payment
      const handleSavePayment = (e) => {
        e.preventDefault();
        if (!formData.studentName.trim()) return;

        let updated = [...payments];
        const lumpSum = formData.is3MonthPayment ? (formData.bittaToliqSumma || (Number(formData.click || 0) + Number(formData.naqd || 0))) : 0;
        const monthlyFee = Number(formData.oylikTolov || 750000);
        const month1Depozit = formData.is3MonthPayment ? Math.max(0, lumpSum - monthlyFee) : 0;

        // Auto-register student into Students Database if not exists
        let currentStudentId = formData.studentId;
        const studentExists = students.find(s => 
          (currentStudentId && s.id === currentStudentId) ||
          s.name.toLowerCase() === formData.studentName.toLowerCase()
        );

        if (!studentExists) {
          const newStudentId = generateStudentId();
          currentStudentId = newStudentId;
          const newStudentEntry = {
            id: newStudentId,
            name: formData.studentName,
            phone: formData.phoneStudent,
            parentPhone: formData.phoneParent,
            group: formData.group,
            monthlyFee: monthlyFee,
            status: 'active',
            joinedDate: getTodayInputFormat()
          };
          setStudents(prev => [newStudentEntry, ...prev]);
        } else if (!currentStudentId) {
          currentStudentId = studentExists.id;
        }

        // Check if student already has a payment record for same month+group or editing
        const existingIdx = formData.editId 
          ? updated.findIndex(p => p.id === formData.editId)
          : (!formData.is3MonthPayment ? updated.findIndex(p =>
              (p.studentId && currentStudentId && p.studentId === currentStudentId && p.month === formData.month) ||
              (p.studentName.toLowerCase() === formData.studentName.toLowerCase() &&
               p.month === formData.month &&
               p.group === formData.group &&
               !p.isPrepaid && !p.is3MonthPayment &&
               !p.naqd2 && !p.click2)
            ) : -1);

        if (existingIdx >= 0) {
          const ex = updated[existingIdx];
          const oldNaqd = Number(ex.naqd || 0);
          const oldClick = Number(ex.click || 0);
          const oldOylik = Number(ex.oylikTolov || 0);
          const oldTotal = oldNaqd + oldClick + Number(ex.naqd2 || 0) + Number(ex.click2 || 0);

          let newNaqd = Number(formData.naqd || 0);
          let newClick = Number(formData.click || 0);
          let newOylik = Number(formData.oylikTolov || 0);

          // RESTRICTION: Non-super-admins cannot alter existing payment amounts!
          if (!isSuperAdmin) {
            newNaqd = oldNaqd;
            newClick = oldClick;
            newOylik = oldOylik;
          }

          // Build Audit History if Super Admin changed amounts
          let historyList = Array.isArray(ex.history) ? [...ex.history] : [];
          const amountChanges = [];
          if (oldNaqd !== newNaqd) amountChanges.push({ field: 'Naqd', oldVal: oldNaqd, newVal: newNaqd });
          if (oldClick !== newClick) amountChanges.push({ field: 'Click', oldVal: oldClick, newVal: newClick });
          if (oldOylik !== newOylik) amountChanges.push({ field: 'Oylik to'lov', oldVal: oldOylik, newVal: newOylik });

          if (isSuperAdmin && amountChanges.length > 0) {
            const newTotal = newNaqd + newClick + Number(ex.naqd2 || 0) + Number(ex.click2 || 0);
            const revision = {
              id: 'REV-' + Date.now(),
              changedAt: getTodayInputFormat() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              changedBy: currentUser ? currentUser.fullName : 'Super Admin',
              role: 'Super Admin',
              oldTotal: oldTotal,
              newTotal: newTotal,
              changes: amountChanges,
              note: formData.editReason || 'Super Admin tomonidan summa o'zgartirildi'
            };
            historyList.unshift(revision);
            showToast(`Summa muvaffaqiyatli o'zgartirildi va tarixga yozildi! (Eski: ${formatMoney(oldTotal)} → Yangi: ${formatMoney(newTotal)})`);
          }

          if ((Number(ex.naqd || 0) + Number(ex.click || 0)) === 0 && !formData.editId) {
            updated[existingIdx] = {
              ...ex,
              ...formData,
              studentId: currentStudentId,
              id: ex.id,
              naqd: newNaqd,
              click: newClick,
              oylikTolov: newOylik,
              operator: ex.operator || (currentUser ? currentUser.fullName : 'Admin'),
              history: historyList,
              paymentDate: formData.paymentDate || getTodayInputFormat(),
              note: formData.note ? formData.note : (ex.note || '')
            };
          } else {
            updated[existingIdx] = {
              ...ex,
              studentId: currentStudentId,
              naqd: newNaqd,
              click: newClick,
              oylikTolov: newOylik,
              operator: ex.operator || (currentUser ? currentUser.fullName : 'Admin'),
              history: historyList,
              paymentDate: formData.paymentDate || ex.paymentDate || getTodayInputFormat(),
              note: formData.note || ex.note || ''
            };
          }
        } else {
          const newPayment = { 
            ...formData, 
            studentId: currentStudentId,
            operator: currentUser ? currentUser.fullName : 'Admin',
            history: [],
            naqd: Number(formData.naqd || 0),
            click: Number(formData.click || 0),
            bittaToliqSumma: lumpSum, 
            depozitBalansi: month1Depozit,
            naqd2: 0, click2: 0, paymentDate2: '', note2: '',
            id: `PAY-${1000 + updated.length + 1}` 
          };
          updated.unshift(newPayment);
        }

        // 3-Month upfront deposit logic
        if (formData.is3MonthPayment) {
          const cIdx = months.indexOf(formData.month);
          let m1 = (cIdx >= 0 && months[cIdx + 1]) ? months[cIdx + 1] : getNextMonthString(formData.month);
          let m2 = (cIdx >= 0 && months[cIdx + 2]) ? months[cIdx + 2] : getNextMonthString(m1);

          setMonths(prev => {
            let nextM = [...prev];
            if (!nextM.includes(m1)) nextM.push(m1);
            if (!nextM.includes(m2)) nextM.push(m2);
            return nextM;
          });

          const month2Depozit = Math.max(0, month1Depozit - monthlyFee);
          const month3Depozit = Math.max(0, month2Depozit - monthlyFee);

          const prepaidEntries = [
            { targetM: m1, remainingDepozit: month2Depozit },
            { targetM: m2, remainingDepozit: month3Depozit }
          ];

          prepaidEntries.forEach(({ targetM, remainingDepozit }) => {
            const existingPrepaidIdx = updated.findIndex(p => p.studentName.toLowerCase() === formData.studentName.toLowerCase() && p.month === targetM);
            const prepaidRecord = {
              studentId: currentStudentId,
              studentName: formData.studentName,
              phoneStudent: formData.phoneStudent,
              phoneParent: formData.phoneParent,
              oylikTolov: monthlyFee,
              naqd: formData.naqd > 0 ? monthlyFee : 0,
              click: formData.click > 0 ? monthlyFee : 0,
              group: formData.group,
              paymentDate: formData.paymentDate,
              month: targetM,
              paymentType: "Oldindan to'langan (3 oylik)",
              note: `${formData.month} depozitidan ${formatMoney(monthlyFee)} ayirildi. Qolgan depozit: ${formatMoney(remainingDepozit)}`,
              isPrepaid: true,
              bittaToliqSumma: lumpSum,

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Kategoriya *</label>
                      <select
                        value={expenseForm.category}
                        onChange={e => setExpenseForm({...expenseForm, category: e.target.value})}
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 text-white text-xs border border-slate-700"
                      >
                        <option>Oqituvchilar oyligi</option>
                        <option>Reklama va Target</option>
                        <option>Markaz xarajatlari</option>
                        <option>Kommunal va Ijara</option>
                        <option>Jihozlar va texnika</option>
                        <option>Boshqa</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Tur</label>
                      <select
                        value={expenseForm.type}
                        onChange={e => setExpenseForm({...expenseForm, type: e.target.value})}
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 text-white text-xs border border-slate-700"
                      >
                        <option value="Kadrlar">Kadrlar</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Fixed">Fixed (Doimiy)</option>
                        <option value="Xojalik">Xojalik</option>
                        <option value="Interyer">Interyer</option>
                        <option value="Boshqa">Boshqa</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Tavsif *</label>
                    <input
                      type="text" required
                      placeholder="Harajat haqida qisqacha..."
                      value={expenseForm.description}
                      onChange={e => setExpenseForm({...expenseForm, description: e.target.value})}
                      className="w-full px-3 py-2 rounded-xl bg-slate-800 text-white text-xs border border-slate-700"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-rose-400 mb-1">Summa (so'm) *</label>
                      <input
                        type="number" required min="0"
                        value={expenseForm.amount}
                        onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})}
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 text-rose-400 text-xs border border-rose-500/40 font-bold"
                        placeholder="0"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Qabul qiluvchi</label>
                      <input
                        type="text"
                        value={expenseForm.recipient}
                        onChange={e => setExpenseForm({...expenseForm, recipient: e.target.value})}
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 text-white text-xs border border-slate-700"
                        placeholder="Ism yoki tashkilot"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Sana</label>
                      <input
                        type="date"
                        value={expenseForm.date}
                        onChange={e => setExpenseForm({...expenseForm, date: e.target.value})}
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 text-white text-xs border border-slate-700"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Oy</label>
                      <select
                        value={expenseForm.month}
                        onChange={e => setExpenseForm({...expenseForm, month: e.target.value})}
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 text-white text-xs border border-slate-700"
                      >
                        {months.map(m => (
                          <option key={m} value={m}>{m}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Live preview */}
                  {expenseForm.amount > 0 && (
                    <div className="p-3 rounded-xl bg-rose-950/30 border border-rose-500/30 text-xs">
                      <span className="text-rose-300">📤 Kiritilayotgan harajat: </span>
                      <span className="font-bold text-rose-400">{formatMoney(Number(expenseForm.amount))}</span>
                      <span className="text-slate-400"> · </span>
                      <span className="text-slate-300">{expenseForm.category}</span>
                      <span className="text-slate-500"> · {expenseForm.month}</span>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button" onClick={() => setIsExpenseModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs"
                    >Bekor qilish</button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-rose-700 hover:bg-rose-600 text-white text-xs font-bold"
                    >Harajatni Saqlash</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===== TOAST NOTIFICATION ===== */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-emerald-400 border border-emerald-500/40 text-xs font-bold shadow-2xl flex items-center gap-2.5 transition-all">
              <span className="text-base">✨</span>
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
