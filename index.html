                    updatedStaff.push(staffObj);
                    newStaffCount++;
                  }
                }
                // 3. Markaz xarajatlari
                else {
                  expType = 'Markaz';
                  if (fullText.includes('marketing') || fullText.includes('target') || fullText.includes('reklama')) {
                    category = 'Reklama va Target';
                  } else if (fullText.includes('arenda') || fullText.includes('ijara')) {
                    category = 'Bino va Ijara';
                  } else if (fullText.includes('svet') || fullText.includes('elektr') || fullText.includes('gaz')) {
                    category = 'Kommunal (Svet/Gaz)';
                  } else if (fullText.includes('suv') || fullText.includes('kuller')) {
                    category = 'Kommunal (Suv)';
                  } else if (fullText.includes('internet') || fullText.includes('server') || fullText.includes('telegram')) {
                    category = 'Internet va IT';
                  } else if (fullText.includes('remont') || fullText.includes('montaj') || fullText.includes("ta'mir")) {
                    category = "Ta'mirlash va Jihoz";
                  } else {
                    category = mapExpenseCategory(recipient, izoxRaw || sababRaw);
                  }
                  recipient = (kimgaRaw && kimgaRaw.toLowerCase() !== 'none') ? kimgaRaw : (izoxRaw || sababRaw || 'Markaz');
                }

                let desc = sababRaw && izoxRaw ? `${sababRaw}: ${izoxRaw}` : (izoxRaw || sababRaw || category);
                if (valAprel > 0 && valMay > 0) {
                  desc += ` (Aprel: ${formatMoney(valAprel)}, May: ${formatMoney(valMay)})`;
                } else if (valAprel > 0) {
                  desc += ` (Aprel oyligidan)`;
                }

                updatedExpenses.push({
                  id: makeExpId(),
                  category,
                  description: desc,
                  amount: summa,
                  recipient: formatProperName(recipient),
                  date: dateVal,
                  month: targetMonth,
                  type: expType
                });
                totalImportedExpense += summa;
                newExpensesCount++;
              }
            } else {
              // Avgust, Iyul, Iyun: Side-by-side xarajatlar va pastdagi Founder bloki
              let inFounderBlock = false;

              for (let i = 2; i < eRows.length; i++) {
                const r = eRows[i];
                if (!r || r.length === 0) continue;

                const rowStr = r.map(c => String(c || '').toLowerCase()).join(' ');
                if (rowStr.includes('founder xarajat') || rowStr.includes("ta'sischi") || rowStr.includes('tasischi')) {
                  inFounderBlock = true;
                  continue;
                }

                if (inFounderBlock) {
                  // Founder xarajatlari bloki (sana, F.I.O, izox, summa)
                  const fSana = r[0];
                  const fIsm = String(r[1] || '').trim();
                  const fIzox = String(r[2] || '').trim();
                  const fSum = parseUzbekMoney(r[5] || r[4] || r[6] || r[7]);
                  if (fIsm && !fIsm.toLowerCase().startsWith('f.i.o') && !fIsm.toLowerCase().startsWith('sana') && !fIsm.toLowerCase().startsWith('jami') && fSum > 0) {
                    const sanaVal = parseExcelDateInBrowser(fSana) || getTodayInputFormat();
                    updatedExpenses.push({
                      id: makeExpId(),
                      category: 'Founder xarajatlari',
                      description: `Founder xarajati: ${fIsm} - ${fIzox || 'Qarz/Dividend'}`,
                      amount: fSum,
                      recipient: fIsm,
                      date: sanaVal,
                      month: targetMonth,
                      type: 'Founder'
                    });
                    totalImportedExpense += fSum;
                    newExpensesCount++;
                  }
                  continue;
                }

                // 1-qism: Xodim maoshi (Chap tomon, Cols 0-9)
                const staffName = r[0] ? String(r[0]).trim() : '';
                
                // Agar qator sana bilan boshlansa (masalan 7/14/26) yoki Founder xarajati bo'lsa
                if (staffName && (staffName.match(/^\d{1,2}[\/.,]/) || (r[1] && ['shahrixon', 'javoxir', 'sardor sayfulloyev'].some(fn => String(r[1]).toLowerCase().includes(fn))))) {
                  const fSana = staffName.match(/^\d{1,2}[\/.,]/) ? staffName : (r[10] || r[11]);
                  const fIsm = staffName.match(/^\d{1,2}[\/.,]/) ? String(r[1] || '').trim() : staffName;
                  const fIzox = staffName.match(/^\d{1,2}[\/.,]/) ? String(r[2] || '').trim() : String(r[2] || r[3] || '').trim();
                  const fSum = parseUzbekMoney(r[6] || r[5] || r[4] || r[7] || r[8] || r[9]);
                  if (fIsm && fSum > 0 && !fIsm.toLowerCase().startsWith('f.i.o') && !fIsm.toLowerCase().startsWith('sana') && !fIsm.toLowerCase().startsWith('jami')) {
                    const sanaVal = parseExcelDateInBrowser(fSana) || getTodayInputFormat();
                    updatedExpenses.push({
                      id: makeExpId(),
                      category: 'Founder harajatlari',
                      description: `Founder xarajati: ${fIsm} - ${fIzox || 'Dividend/Xarajat'}`,
                      amount: fSum,
                      recipient: fIsm,
                      date: sanaVal,
                      month: targetMonth,
                      type: 'Founder'
                    });
                    totalImportedExpense += fSum;
                    newExpensesCount++;
                  }
                }
                else if (staffName && staffName.length > 3 && !staffName.toLowerCase().startsWith('f.i.o') && !staffName.toLowerCase().startsWith('jami') && !staffName.toLowerCase().startsWith('sana') && !staffName.toLowerCase().startsWith('markaz') && !staffName.toLowerCase().startsWith('mani') && !staffName.toLowerCase().startsWith('man ')) {
                  const normStaff = normalizeName(staffName);
                  const oyligi = parseUzbekMoney(r[2]);
                  const avans = parseUzbekMoney(r[5] || r[4]);
                  const qarz = parseUzbekMoney(r[6]);
                  const shuOy = parseUzbekMoney(r[7] || r[6]);
                  let oshxona = parseUzbekMoney(r[8] || r[7]);
                  if (oshxona === 0 && kitchenTotals[normStaff]) {
                    oshxona = kitchenTotals[normStaff];
                  }
                  const jami = parseUzbekMoney(r[9] || r[8] || r[10]);
                  const izoh = r[3] ? String(r[3]).trim() : '';

                  let staffObj = updatedStaff.find(s => normalizeName(s.name) === normStaff);
                  if (!staffObj) {
                    staffObj = {
                      id: makeStfId(),
                      name: formatProperName(staffName),
                      phone: '+998 ',
                      role: staffName.toLowerCase().includes('direktor') || staffName.toLowerCase().includes('admin') || staffName.toLowerCase().includes('farrosh') ? 'staff' : 'teacher',
                      position: izoh || (staffName.toLowerCase().includes('direktor') ? 'Direktor' : (staffName.toLowerCase().includes('admin') ? 'Administrator' : 'Ustoz')),
                      percent: 40,
                      fixedSalary: oyligi > 0 ? oyligi : 0,
                      joinedDate: getTodayInputFormat(),
                      status: 'active'
                    };
                    updatedStaff.push(staffObj);
                    newStaffCount++;
                  } else {
                    if (oyligi > 0) staffObj.fixedSalary = oyligi;
                    if (izoh) staffObj.position = izoh;
                  }

                  const payAmount = jami > 0 ? jami : (avans > 0 ? avans : (shuOy > 0 ? shuOy : oyligi));
                  if (payAmount > 0) {
                    let desc = `Xodim maoshi: ${staffObj.name}`;
                    const details = [];
                    if (avans > 0) details.push(`Avans: -${formatMoney(avans)}`);
                    if (oshxona > 0) details.push(`Oshxona: -${formatMoney(oshxona)}`);
                    if (qarz > 0) details.push(`Qarz: ${formatMoney(qarz)}`);
                    if (details.length > 0) desc += ` (${details.join(', ')})`;
                    if (izoh) desc += ` [${izoh}]`;

                    updatedExpenses.push({
                      id: makeExpId(),
                      category: staffName.toLowerCase().includes('direktor') || staffName.toLowerCase().includes('admin') || staffName.toLowerCase().includes('farrosh') ? 'Xodimlar oyligi' : "O'qituvchilar oyligi",
                      description: desc,
                      amount: payAmount,
                      recipient: staffObj.name,
                      date: getTodayInputFormat(),
                      month: targetMonth,
                      type: 'Kadrlar'
                    });
                    totalImportedExpense += payAmount;
                    newExpensesCount++;
                  }
                }

                // 2-qism: Markaz xarajati (O'ng tomon, Cols 10-18)
                const expDateRaw = r[11] || r[10];
                const expKimga = r[12] || r[11];
                const expIzox = r[13] || r[12];
                const expJami = parseUzbekMoney(r[17]);
                const shuOySum = parseUzbekMoney(r[16] || r[14]);
                const oldingiSum = parseUzbekMoney(r[15] || r[13]);
                const keyingiSum = parseUzbekMoney(r[15]);
                const expSum = expJami > 0 ? expJami : (((shuOySum > 0 ? shuOySum : 0) + (oldingiSum > 0 ? oldingiSum : 0) + (keyingiSum > 0 ? keyingiSum : 0)) || parseUzbekMoney(r[16] || r[14] || r[15]));

                if (expKimga && typeof expKimga === 'string' && expKimga.trim().length > 2 && 
                    !expKimga.toLowerCase().startsWith('f.i.o') && !expKimga.toLowerCase().startsWith('markaz xarajat') && !expKimga.toLowerCase().startsWith('jami') && expSum > 0) {
                  const sana = parseExcelDateInBrowser(expDateRaw) || getTodayInputFormat();
                  updatedExpenses.push({
                    id: makeExpId(),
                    category: mapExpenseCategory(String(expKimga).trim(), String(expIzox || '').trim()),
                    description: expIzox ? `${String(expKimga).trim()} - ${String(expIzox).trim()}` : String(expKimga).trim(),
                    amount: expSum,
                    recipient: String(expKimga).trim(),
                    date: sana,
                    month: targetMonth,
                    type: 'Markaz'
                  });
                  totalImportedExpense += expSum;
                  newExpensesCount++;
                }
              }
            }
          }

          // D) Click daftari: qo'shimcha tushum va chiqimlar
          if (clickSheet) {
            const clkRows = window.XLSX.utils.sheet_to_json(clickSheet, { header: 1, raw: false });
            for (let i = 1; i < clkRows.length; i++) {
              const r = clkRows[i];
              if (!r || r.length === 0) continue;
              const rText = r.map(c => String(c || '')).join(' ').toLowerCase();
              if (rText.includes('no') && rText.includes('summa')) continue;

              const chiqimSum = parseUzbekMoney(r[5] || r[4]);
              const chiqimIzox = String(r[6] || r[5] || '').trim();
              if (chiqimIzox && !chiqimIzox.toLowerCase().includes('jmai') && !chiqimIzox.toLowerCase().includes('jami') && !chiqimIzox.toLowerCase().includes('kartada') && chiqimSum > 0 && chiqimSum < 10000000) {
                updatedExpenses.push({
                  id: makeExpId(),
                  category: chiqimIzox.toLowerCase().includes('arenda') ? 'Kommunal va Ijara' : 'Boshqa',
                  description: `Click chiqim: ${chiqimIzox}`,

                  month: targetMonth,
                  type: 'Click'
                });
                totalImportedExpense += chiqimSum;
                newExpensesCount++;

            }
          }

          setStudents(updatedStudents);
          setGroups(updatedGroups);
          setStaff(updatedStaff);
          setPayments(updatedPayments);
          setExpenses(updatedExpenses);
          setMonths(updatedMonths);
          setSelectedMonth(targetMonth);

          const summaryObj = {
            fileName,
            month: targetMonth,
            paymentsCount: newPaymentsCount,
            studentsCount: newStudentsCount,
            droppedStudentsCount: droppedStudentsCount,
            matchedStudentsCount: matchedStudentsCount,
            expensesCount: newExpensesCount,
            staffCount: newStaffCount,
            totalIncome: totalImportedIncome,
            totalExpense: totalImportedExpense,
            debtorsCount,
            manOlmaganmanCount,
            netProfit: totalImportedIncome - totalImportedExpense
          };

          setExcelImportSummary(summaryObj);
          setIsExcelImportModalOpen(true);
          showToast(`"${fileName}" fayli ${targetMonth} oyiga muvaffaqiyatli yuklandi (Yangi talabalar: ${newStudentsCount}, Baza bilan mos tushganlar: ${matchedStudentsCount})`);

          // Supabase-ga avtomatik tarzda barcha yuklangan ma'lumotlarni yuborish (Auto-push to Supabase)
          if (supabase) {
            handleSyncToSupabase({ silent: false }, {
              groups: updatedGroups,
              users: users,
              students: updatedStudents,
              months: updatedMonths,

            });

        } catch (err) {

        } finally {
          setIsExcelLoading(false);
          setPendingExcelUpload(null);
        }
      };

      // Supabase Push (Upload All Data to Supabase - avtomatik yoki qo'lda)
      const handleSyncToSupabase = async (opts = {}, customData = null) => {
        const isSilent = opts && opts.silent;
        if (!supabase) {
          if (!isSilent) showToast("Supabase sozlamalari to'liq emas (URL yoki Anon Key xato)!");
          return;
        }
        setIsSyncing(true);
        try {
          const curGroups = (customData && customData.groups) || groups;
          const curUsers = (customData && customData.users) || users;
          const curStudents = (customData && customData.students) || students;
          const curMonths = (customData && customData.months) || months;
          const curPayments = (customData && customData.payments) || payments;
          const curExpenses = (customData && customData.expenses) || expenses;
          const curStaff = (customData && customData.staff) || staff;

          // PostgreSQL "ON CONFLICT DO UPDATE command cannot affect row a second time" xatosini
          // butunlay yo'q qilish uchun har bir to'plamning ID larini 100% unikal qilish helperi:
          let dedupSeq = 0;
          const ensureUniquePayload = (list, prefix, mapper) => {
            const seenIds = new Set();
            const result = [];
            for (let i = 0; i < list.length; i++) {
              const item = list[i];
              if (!item) continue;
              const mapped = mapper(item);
              let id = mapped.id ? String(mapped.id).trim() : '';
              if (!id || seenIds.has(id)) {
                id = `${prefix}-${Date.now().toString(36)}-${++dedupSeq}-${Math.random().toString(36).substring(2, 7)}`;
                mapped.id = id;
              }
              seenIds.add(id);
              result.push(mapped);
            }
            return result;
          };

          // Katta ma'lumotlarni xavfsiz qismlarga (chunk) bo'lib yuklash
          const safeChunkedUpsert = async (tableName, items, chunkSize = 80) => {
            if (!items || items.length === 0) return;
            for (let i = 0; i < items.length; i += chunkSize) {
              const chunk = items.slice(i, i + chunkSize);
              const { error } = await supabase.from(tableName).upsert(chunk);
              if (error) throw new Error(`${tableName} jadvalini yuklashda xato: ${error.message}`);
            }
          };

          // 1. Sync Groups
          const mappedGroups = ensureUniquePayload(curGroups, 'GRP', g => ({
            id: g.id,
            name: g.name,
            category: g.category || 'Dasturlash',
            fee: Number(g.fee || 0),
            teacher: g.teacher || '',
            days: g.days || '',
            room: g.room || ''
          }));
          await safeChunkedUpsert('groups', mappedGroups);

          // 2. Sync Users
          const mappedUsers = ensureUniquePayload(curUsers, 'USR', u => ({
            id: u.id,
            username: u.username,
            password: u.password,
            full_name: u.fullName,
            role: u.role || 'admin',
            phone: u.phone || ''
          }));
          try { await safeChunkedUpsert('users', mappedUsers); } catch(ue) { console.warn('Users sync notice:', ue); }

                foundCloudData = true;
              }
            } catch(e) { console.warn('Cloud staff fetch notice:', e); }

            if (isMounted) {
              setSupabaseConfig(prev => ({ ...prev, isConnected: true }));
              if (foundCloudData) {
                showToast("Supabase bulutidagi ma'lumotlar yuklandi.");
              }
            }
          } catch (err) {
            console.error('Supabase auto load error:', err);
          } finally {
            if (isMounted) setIsSyncing(false);
          }
        };

        autoSyncOnStartup();
        return () => { isMounted = false; };
      }, [supabase]);


      // 1-Click: Add next sequential month
      const handleAddNextMonthDirectly = () => {
        const lastMonth = months[months.length - 1];
        const nextM = getNextMonthString(lastMonth);
        if (!months.includes(nextM)) {
          setMonths(prev => [...prev, nextM]);
          syncMonthToSupabase(nextM);
          setSelectedMonth(nextM);
          showToast(`Yangi oy ochildi: ${nextM}`);
        } else {
          setSelectedMonth(nextM);
          showToast(`${nextM} tanlandi`);
        }
      };

      // Open Add Month Modal
      const openAddMonthModal = () => {
        const lastMonth = months[months.length - 1];
        const nextSuggested = getNextMonthString(lastMonth);
        setNewMonthInput(nextSuggested);
        setIsMonthModalOpen(true);
      };

      // Save Month from Modal
      const handleSaveNewMonthModal = (e) => {
        if (e) e.preventDefault();
        if (!newMonthInput || !newMonthInput.trim()) return;
        const trimmed = newMonthInput.trim();
        if (!months.includes(trimmed)) {
          setMonths(prev => [...prev, trimmed]);
        }
        setSelectedMonth(trimmed);
        setIsMonthModalOpen(false);
        showToast(`Yangi oy qo'shildi: ${trimmed}`);
      };

      // Delete Month Request
      const requestDeleteMonth = (monthToDelete) => {
        if (!monthToDelete || monthToDelete === 'all') return;
        if (months.length <= 1) {
          showToast("Oxirgi qolgan oyni o'chirib bo'lmaydi!");
          return;
        }
        setMonthToDeleteConfirm(monthToDelete);
      };

      // Execute Month Deletion
      // Execute Month Deletion (Full cleanup of Payments, Expenses, Month, and Month-scoped Students)
      const executeDeleteMonth = async () => {
        if (!monthToDeleteConfirm) return;
        const m = monthToDeleteConfirm;

        // 1. Calculate remaining payments and find orphaned students that only belong to month m
        const remainingPayments = payments.filter(p => p.month !== m);
        const remainingStudentIds = new Set(remainingPayments.map(p => p.studentId).filter(Boolean));
        const remainingStudentNames = new Set(remainingPayments.map(p => normalizeName(p.studentName)).filter(Boolean));

        const studentsToDelete = students.filter(s => {
          const hasOtherMonthPayments = remainingStudentIds.has(s.id) || remainingStudentNames.has(normalizeName(s.name));
          return !hasOtherMonthPayments;
        });

        const studentsToKeep = students.filter(s => {
          const hasOtherMonthPayments = remainingStudentIds.has(s.id) || remainingStudentNames.has(normalizeName(s.name));
          return hasOtherMonthPayments;
        });

        // 2. Update local React state
        const newMonths = months.filter(item => item !== m);
        setMonths(newMonths);
        setPayments(remainingPayments);
        setExpenses(prev => prev.filter(e => e.month !== m));
        setStudents(studentsToKeep);

        // 3. Sync full deletion to Supabase
        if (supabase && supabaseConfig.autoSync) {
          try {
            await supabase.from('months').delete().eq('name', m);
            await supabase.from('payments').delete().eq('month', m);
            await supabase.from('expenses').delete().eq('month', m);
            if (studentsToDelete.length > 0) {
              const ids = studentsToDelete.map(s => s.id);
              for (let i = 0; i < ids.length; i += 50) {
                const batch = ids.slice(i, i + 50);
                await supabase.from('students').delete().in('id', batch);
              }
            }
          } catch(err) {
            console.error('Supabase month full delete error:', err);
          }
        }

        // 4. Update selectedMonth
        if (selectedMonth === m) {
          const fallback = newMonths[newMonths.length - 1] || 'all';
          setSelectedMonth(fallback);
        }

        setMonthToDeleteConfirm(null);
        showToast(`"${m}" oyi va unga tegishli barcha ma'lumotlar (${studentsToDelete.length} ta talaba, to'lovlar, xarajatlar) to'liq o'chirildi!`);
      };

      // Rollover students from database into target month
      const handleRolloverStudents = (targetMonth) => {
        const activeStudents = students.filter(s => s.status === 'active');
        if (activeStudents.length === 0) {
          showToast("Faol o'quvchilar ro'yxati bo'sh! Avval 'O'quvchilar' bo'limida o'quvchi qo'shing.");
          return;
        }

        const existingInTarget = payments.filter(p => p.month === targetMonth);
        let addedCount = 0;
        const newRecords = [];

        activeStudents.forEach(stu => {
          const alreadyExists = existingInTarget.some(
            p => (p.studentId && p.studentId === stu.id) ||
                 (p.studentName.trim().toLowerCase() === stu.name.trim().toLowerCase() &&
                  (p.group || '').trim().toLowerCase() === (stu.group || '').trim().toLowerCase())
          );

          if (!alreadyExists) {
            newRecords.push({
              id: `PAY-${1000 + payments.length + newRecords.length + 1}`,
              studentId: stu.id,
              studentName: stu.name,
              phoneStudent: stu.phone,
              phoneParent: stu.parentPhone,
              oylikTolov: Number(stu.monthlyFee || 750000),
              naqd: 0,
              click: 0,
              group: stu.group,
              paymentDate: getTodayInputFormat(),
              month: targetMonth,
              paymentType: 'Kutilmoqda',
              note: "O'quvchilar bazasidan yangi oyga shakllantirildi (To'lov kutilmoqda)",
              is3MonthPayment: false,
              bittaToliqSumma: 0,
              depozitBalansi: 0,
              naqd2: 0,
              click2: 0,
              paymentDate2: '',
              note2: ''
            });
            addedCount++;
          }
        });

        if (addedCount === 0) {
          showToast(`Barcha faol o'quvchilar allaqachon ${targetMonth} oyida mavjud!`);
          return;
        }

        setPayments(prev => [...newRecords, ...prev]);
        showToast(`${addedCount} ta o'quvchi ${targetMonth} oyiga kiritildi!`);
      };

      // Autocomplete Search Matches for Payment Modal
      const studentMatches = useMemo(() => {
        if (!studentQuery.trim()) return [];
        const q = studentQuery.toLowerCase().trim();
        return students.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.id.toLowerCase().includes(q) ||
          (s.phone && s.phone.includes(q))
        ).slice(0, 6);
      }, [students, studentQuery]);

      // Select student from Autocomplete
      const handleSelectStudent = (stu) => {
        setFormData(prev => ({
          ...prev,
          studentId: stu.id,
          studentName: stu.name,
          phoneStudent: stu.phone,
          phoneParent: stu.parentPhone,
          group: stu.group,
          oylikTolov: stu.monthlyFee,
          click: stu.monthlyFee,
          naqd: 0
        }));
        setStudentQuery(`${stu.name} (${stu.id})`);
        setIsAutocompleteOpen(false);
      };

      // Save or Update Student
      const handleSaveStudent = (e) => {
        e.preventDefault();
        if (!studentForm.name.trim()) return;

        const isExisting = students.some(s => s.id === studentForm.id);
        const cleanMonthlyFee = autoExpandThousand(studentForm.monthlyFee || 750000);
        const updatedFormData = {
          ...studentForm,
          monthlyFee: cleanMonthlyFee
        };

        if (isExisting) {
          setStudents(prev => prev.map(s => s.id === studentForm.id ? { ...updatedFormData } : s));
          logAdminAction('STUDENT_EDIT', "O'quvchi", `${updatedFormData.name} ma'lumotlari tahrirlandi (${updatedFormData.group}, oylik: ${formatMoney(updatedFormData.monthlyFee)})`);
          showToast("O'quvchi ma'lumotlari yangilandi!");
        } else {
          const newStu = {
            ...updatedFormData,
            id: studentForm.id || generateStudentId()
          };
          setStudents(prev => [newStu, ...prev]);
          logAdminAction('STUDENT_ADD', "O'quvchi", `Yangi o'quvchi qo'shildi: ${newStu.name} (${newStu.group}, oylik: ${formatMoney(newStu.monthlyFee)})`);
          showToast(`Yangi o'quvchi saqlandi: ${newStu.name} (${newStu.id})`);
          syncStudentToSupabase(newStu);
        }
        if (isExisting) {
          syncStudentToSupabase(updatedFormData);
        }
        setIsStudentModalOpen(false);
      };

      // Delete Student
      const handleDeleteStudent = (id) => {
        const target = students.find(s => s.id === id);
        if (window.confirm("Bu o'quvchini o'chirmoqchimisiz?")) {
          setStudents(prev => prev.filter(s => s.id !== id));
          if (target) {
            logAdminAction('STUDENT_DELETE', "O'quvchi", `${target.name} (${target.group || ''}) o'quvchilar bazasidan o'chirildi`);
          }
          showToast("O'quvchi o'chirildi");
        }
      };

      // Save or Update Group
      const handleSaveGroup = (e) => {
        e.preventDefault();
        if (!groupForm.name.trim()) return;

        const cleanFee = autoExpandThousand(groupForm.fee || 750000);
        const updatedGroupData = {
          ...groupForm,

        };

        if (isExisting) {
          setGroups(prev => prev.map(g => g.id === groupForm.id ? { ...updatedGroupData } : g));
          logAdminAction('GROUP_EDIT', 'Guruh', `${updatedGroupData.name} guruhi tahrirlandi (oylik: ${formatMoney(updatedGroupData.fee)})`);
          showToast("Guruh ma'lumotlari yangilandi!");
        } else {
          const newGrp = {
            ...updatedGroupData,
            id: groupForm.id || `GRP-${Math.floor(100 + Math.random() * 900)}`
          };
          setGroups(prev => [...prev, newGrp]);
          logAdminAction('GROUP_ADD', 'Guruh', `Yangi guruh ochildi: ${newGrp.name} (oylik: ${formatMoney(newGrp.fee)}, o'qituvchi: ${newGrp.teacher || 'Ustoz'})`);
          showToast(`Yangi guruh ochildi: ${newGrp.name}`);
        }
        setIsGroupModalOpen(false);
      };

      // Delete Group
      const handleDeleteGroup = (id) => {
        const target = groups.find(g => g.id === id);
        if (window.confirm("Bu guruhni o'chirmoqchimisiz?")) {
          setGroups(prev => prev.filter(g => g.id !== id));
          if (target) {
            logAdminAction('GROUP_DELETE', 'Guruh', `"${target.name}" guruhi tizimdan o'chirildi`);
          }
          showToast("Guruh o'chirildi");
        }
      };

      // Delete Payment
      const handleDeletePayment = (id) => {
        const target = payments.find(p => p.id === id);
        if (window.confirm("Haqiqatan ham bu to'lov yozuvini o'chirmoqchimisiz?")) {
          setPayments(prev => prev.filter(p => p.id !== id));
          if (target) {
            logAdminAction('PAYMENT_DELETE', "To'lov", `${target.studentName} ning ${target.month} oyi uchun ${formatMoney(getTotalPaid(target))} to'lovi o'chirildi`);
          }
          showToast("To'lov o'chirildi");
        }
      };

      // Quick Pay handler
      const handleQuickPay = (p) => {
        setFormData({
          studentId: p.studentId || '',
          studentName: p.studentName,
          phoneStudent: p.phoneStudent || '+998 ',
          phoneParent: p.phoneParent || '+998 ',
          oylikTolov: Number(p.oylikTolov || 750000),
          naqd: 0,
          click: Number(p.oylikTolov || 750000),
          group: p.group || groups[0]?.name || 'Frontend ReactJS (A1)',
          paymentDate: getTodayInputFormat(),

          paymentType: 'Click',

          is3MonthPayment: false,
          bittaToliqSumma: 0,
          depozitBalansi: 0
        });
        setStudentQuery(p.studentName + (p.studentId ? ` (${p.studentId})` : ''));
        setIsModalOpen(true);
      };

      // Edit Payment handler (Super Admin full edit, small admin view/add note)
      const handleEditPayment = (p) => {
        setFormData({
          editId: p.id,
          studentId: p.studentId || '',
          studentName: p.studentName,
          phoneStudent: p.phoneStudent || '+998 ',
          phoneParent: p.phoneParent || '+998 ',
          oylikTolov: Number(p.oylikTolov || 750000),
          naqd: Number(p.naqd || 0),
          click: Number(p.click || 0),
          group: p.group || groups[0]?.name || 'Frontend ReactJS (A1)',
          paymentDate: p.paymentDate || getTodayInputFormat(),
          month: p.month,
          paymentType: p.paymentType || 'Click',
          note: p.note || '',
          is3MonthPayment: !!p.is3MonthPayment,
          bittaToliqSumma: Number(p.bittaToliqSumma || 0),
          depozitBalansi: Number(p.depozitBalansi || 0),
          naqd2: Number(p.naqd2 || 0),
          click2: Number(p.click2 || 0),
          paymentDate2: p.paymentDate2 || '',
          editReason: ''
        });
        setStudentQuery(p.studentName + (p.studentId ? ` (${p.studentId})` : ''));
        setIsModalOpen(true);
      };

      // Save Payment
      const handleSavePayment = (e) => {
        e.preventDefault();
        if (!formData.studentName.trim()) return;

        let updated = [...payments];
        const monthlyFee = autoExpandThousand(formData.oylikTolov || 750000);
        const inputNaqd = autoExpandThousand(formData.naqd || 0);
        const inputClick = autoExpandThousand(formData.click || 0);
        const inputLump = autoExpandThousand(formData.bittaToliqSumma || 0);

        const lumpSum = formData.is3MonthPayment ? (inputLump || (inputClick + inputNaqd)) : 0;
        const month1Depozit = formData.is3MonthPayment ? Math.max(0, lumpSum - monthlyFee) : 0;

        // Auto-register student into Students Database if not exists
        let currentStudentId = formData.studentId;
        const studentExists = students.find(s => 
          (currentStudentId && s.id === currentStudentId) ||
          s.name.toLowerCase() === formData.studentName.toLowerCase()
        );

        if (!studentExists) {
          const newStudentId = generateStudentId();
          currentStudentId = newStudentId;
          const newStudentEntry = {
            id: newStudentId,
            name: formData.studentName,
            phone: formData.phoneStudent,
            parentPhone: formData.phoneParent,
            group: formData.group,
            monthlyFee: monthlyFee,
            status: 'active',
            joinedDate: getTodayInputFormat()
          };
          setStudents(prev => [newStudentEntry, ...prev]);
        } else if (!currentStudentId) {
          currentStudentId = studentExists.id;
        }

        // Check if student already has a payment record for same month+group or editing
        const existingIdx = formData.editId 
          ? updated.findIndex(p => p.id === formData.editId)
          : (!formData.is3MonthPayment ? updated.findIndex(p =>
              (p.studentId && currentStudentId && p.studentId === currentStudentId && p.month === formData.month) ||
              (p.studentName.toLowerCase() === formData.studentName.toLowerCase() &&
               p.month === formData.month &&
               p.group === formData.group &&
               !p.isPrepaid && !p.is3MonthPayment &&
               !p.naqd2 && !p.click2)
            ) : -1);

        if (existingIdx >= 0) {
          const ex = updated[existingIdx];
          const oldNaqd = Number(ex.naqd || 0);
          const oldClick = Number(ex.click || 0);
          const oldOylik = Number(ex.oylikTolov || 0);
          const oldTotal = oldNaqd + oldClick + Number(ex.naqd2 || 0) + Number(ex.click2 || 0);

          let newNaqd = inputNaqd;
          let newClick = inputClick;
          let newOylik = monthlyFee;

          // RESTRICTION: Non-super-admins cannot alter existing payment amounts!
          if (!isSuperAdmin) {
            newNaqd = oldNaqd;
            newClick = oldClick;
            newOylik = oldOylik;
          }

          // Build Audit History if Super Admin changed amounts
          let historyList = Array.isArray(ex.history) ? [...ex.history] : [];
          const amountChanges = [];
          if (oldNaqd !== newNaqd) amountChanges.push({ field: 'Naqd', oldVal: oldNaqd, newVal: newNaqd });
          if (oldClick !== newClick) amountChanges.push({ field: 'Click', oldVal: oldClick, newVal: newClick });
          if (oldOylik !== newOylik) amountChanges.push({ field: "Oylik to'lov", oldVal: oldOylik, newVal: newOylik });

          if (isSuperAdmin && amountChanges.length > 0) {
            const newTotal = newNaqd + newClick + Number(ex.naqd2 || 0) + Number(ex.click2 || 0);
            const revision = {
              id: 'REV-' + Date.now(),
              changedAt: getTodayInputFormat() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              changedBy: currentUser ? currentUser.fullName : 'Super Admin',
              role: 'Super Admin',
              oldTotal: oldTotal,
              newTotal: newTotal,
              changes: amountChanges,
              note: formData.editReason || "Super Admin tomonidan summa o'zgartirildi"
            };
            historyList.unshift(revision);
            logAdminAction('PAYMENT_EDIT_SUM', "Summa o'zgartirish", `${formData.studentName} to'lov summasi o'zgartirildi: ${formatMoney(oldTotal)} → ${formatMoney(newTotal)} (${newTotal >= oldTotal ? '+' : ''}${formatMoney(newTotal - oldTotal)}). Izoh: ${formData.editReason || "Super Admin tomonidan o'zgartirildi"}`);
            showToast(`Summa muvaffaqiyatli o'zgartirildi va tarixga yozildi! (Eski: ${formatMoney(oldTotal)} → Yangi: ${formatMoney(newTotal)})`);
          }

          if ((Number(ex.naqd || 0) + Number(ex.click || 0)) === 0 && !formData.editId) {
            updated[existingIdx] = {
              ...ex,
              ...formData,
              studentId: currentStudentId,
              id: ex.id,
              naqd: newNaqd,
              click: newClick,
              oylikTolov: newOylik,
              operator: ex.operator || (currentUser ? currentUser.fullName : 'Admin'),
              history: historyList,
              paymentDate: formData.paymentDate || getTodayInputFormat(),
              note: formData.note ? formData.note : (ex.note || '')
            };
          } else {
            updated[existingIdx] = {
              ...ex,
              studentId: currentStudentId,
              naqd: newNaqd,
              click: newClick,
              oylikTolov: newOylik,
              operator: ex.operator || (currentUser ? currentUser.fullName : 'Admin'),
              history: historyList,
              paymentDate: formData.paymentDate || ex.paymentDate || getTodayInputFormat(),
              note: formData.note || ex.note || ''
            };
          }
        } else {
          const newPayment = { 
            ...formData, 
            studentId: currentStudentId,
            operator: currentUser ? currentUser.fullName : 'Admin',
            history: [],
            naqd: inputNaqd,
            click: inputClick,
            oylikTolov: monthlyFee,
            bittaToliqSumma: lumpSum, 
            depozitBalansi: month1Depozit,
            naqd2: 0, click2: 0, paymentDate2: '', note2: '',
            id: `PAY-${1000 + updated.length + 1}` 
          };
          updated.unshift(newPayment);

          const paidNow = Number(newPayment.naqd || 0) + Number(newPayment.click || 0);
          logAdminAction('PAYMENT_ADD', "To'lov", `${formData.studentName} uchun ${formatMoney(paidNow)} so'm (${formData.paymentType || 'To\'lov'}) qabul qilindi. Oy: ${formData.month}, Guruh: ${formData.group}`);
        }

        // 3-Month upfront deposit logic
        if (formData.is3MonthPayment) {
          const cIdx = months.indexOf(formData.month);
          let m1 = (cIdx >= 0 && months[cIdx + 1]) ? months[cIdx + 1] : getNextMonthString(formData.month);
          let m2 = (cIdx >= 0 && months[cIdx + 2]) ? months[cIdx + 2] : getNextMonthString(m1);

          setMonths(prev => {
            let nextM = [...prev];
            if (!nextM.includes(m1)) nextM.push(m1);
            if (!nextM.includes(m2)) nextM.push(m2);
            return nextM;
          });

          const month2Depozit = Math.max(0, month1Depozit - monthlyFee);
          const month3Depozit = Math.max(0, month2Depozit - monthlyFee);

          const prepaidEntries = [
            { targetM: m1, remainingDepozit: month2Depozit },
            { targetM: m2, remainingDepozit: month3Depozit }
          ];

          prepaidEntries.forEach(({ targetM, remainingDepozit }) => {
            const existingPrepaidIdx = updated.findIndex(p => p.studentName.toLowerCase() === formData.studentName.toLowerCase() && p.month === targetM);
            const prepaidRecord = {
              studentId: currentStudentId,
              studentName: formData.studentName,
              phoneStudent: formData.phoneStudent,
              phoneParent: formData.phoneParent,
              oylikTolov: monthlyFee,
              naqd: inputNaqd > 0 ? monthlyFee : 0,
              click: inputClick > 0 ? monthlyFee : 0,
              group: formData.group,
              paymentDate: formData.paymentDate,
              month: targetM,
              paymentType: "Oldindan to'langan (3 oylik)",
              note: `${formData.month} depozitidan ${formatMoney(monthlyFee)} ayirildi. Qolgan depozit: ${formatMoney(remainingDepozit)}`,
              isPrepaid: true,
              bittaToliqSumma: lumpSum,
              depozitBalansi: remainingDepozit,
              naqd2: 0, click2: 0, paymentDate2: '', note2: ''
            };

            if (existingPrepaidIdx >= 0) {
              updated[existingPrepaidIdx] = { ...updated[existingPrepaidIdx], ...prepaidRecord };
            } else {
              updated.push({ id: `PAY-PRE-${Math.floor(Math.random() * 9000) + 1000}`, ...prepaidRecord });
            }
          });
        }

        setPayments(updated);
        syncPaymentsBatchToSupabase(updated);
        setIsModalOpen(false);
        showToast("To'lov muvaffaqiyatli saqlandi!");
      };

      // Save Expense
      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.description.trim() || !expenseForm.amount) return;
        const cleanAmount = autoExpandThousand(expenseForm.amount);
        const newExp = {

        };

        });

      // Delete Expense

          }
          showToast("Harajat o'chirildi");
        }
      };

      // Save Staff (Ustoz yoki Xodim)
      const handleSaveStaff = (e) => {
        if (e) e.preventDefault();
        if (!staffForm.name.trim()) return;

        const isExisting = staff.some(s => s.id === staffForm.id);
        const cleanPercent = Number(staffForm.percent || 0);

          };

          logAdminAction('STAFF_EDIT', 'Xodim', `${savedStaff.name} ma'lumotlari tahrirlandi (${savedStaff.role === 'teacher' ? savedStaff.percent + '% foiz' : formatMoney(savedStaff.fixedSalary) + ' oylik'})`);
          showToast("Xodim ma'lumotlari muvaffaqiyatli yangilandi!");
        } else {
          savedStaff = {
            ...staffForm,
            id: 'STF-' + Math.floor(100 + Math.random() * 900),
            percent: cleanPercent,
            fixedSalary: cleanSalary,
            joinedDate: staffForm.joinedDate || getTodayInputFormat()
          };
          setStaff(prev => [...prev, savedStaff]);
          logAdminAction('STAFF_ADD', 'Xodim', `Yangi ${savedStaff.role === 'teacher' ? 'ustoz' : 'xodim'} qo'shildi: ${savedStaff.name} (${savedStaff.position})`);
          showToast(`Yangi xodim saqlandi: ${savedStaff.name}`);
        }
        syncStaffToSupabase(savedStaff);
        setIsStaffModalOpen(false);
      };

      // Delete Staff
      const handleDeleteStaff = (id) => {
        const target = staff.find(s => s.id === id);
        if (window.confirm(`Haqiqatan ham "${target ? target.name : id}" xodimini o'chirmoqchimisiz?`)) {
          setStaff(prev => prev.filter(s => s.id !== id));
          deleteStaffFromSupabase(id);
          if (target) {
            logAdminAction('STAFF_DELETE', 'Xodim', `${target.name} (${target.position}) xodimlar bazasidan o'chirildi`);
          }
          showToast("Xodim o'chirildi");
        }
      };

      // 1-Click Pay Staff Salary -> writes directly into expenses!
      const handlePayStaffSalary = (person, amount, targetMonth) => {
        if (!amount || amount <= 0) {
          alert("To'lanishi kerak bo'lgan summa 0 bo'lgani sababli to'lov amalga oshirilmadi.");
          return;
        }
        if (!window.confirm(`${person.name} ga ${targetMonth} oyi uchun ${formatMoney(amount)} oylik to'lovini markaz harajatlariga qo'shmoqchimisiz?`)) {
          return;
        }
        const catName = person.role === 'teacher' ? 'Oqituvchilar oyligi' : 'Xodimlar oyligi';
        const newExp = {
          id: `EXP-${5000 + expenses.length + 1}`,
          category: catName,
          description: `${person.name} (${person.position || (person.role === 'teacher' ? 'Ustoz' : 'Xodim')}) - ${targetMonth} oyligi`,
          amount: Math.round(amount),
          recipient: person.name,
          date: getTodayInputFormat(),
          month: targetMonth,
          type: 'Kadrlar'
        };
        setExpenses(prev => [newExp, ...prev]);
        syncExpenseToSupabase(newExp);
        logAdminAction('PAYROLL_PAY', 'Oylik to\'lovi', `${person.name} ga ${targetMonth} oyi uchun ${formatMoney(amount)} oylik to'landi (${catName})`);
        showToast(`${person.name} uchun ${formatMoney(amount)} oylik to'landi va harajatga yozildi.`);
      };

      // Filtered Payments
      const filteredPayments = useMemo(() => {
        return payments.filter(p => {
          if (selectedMonth !== 'all' && p.month !== selectedMonth) return false;
          if (searchTerm) {
            const s = searchTerm.toLowerCase();
            const matchName = p.studentName.toLowerCase().includes(s);
            const matchId = p.studentId && p.studentId.toLowerCase().includes(s);
            const matchPayId = p.id.toLowerCase().includes(s);
            if (!matchName && !matchId && !matchPayId) return false;
          }
          if (selectedGroup !== 'all' && p.group !== selectedGroup) return false;
          if (selectedStatus !== 'all') {
            const paid = Number(p.naqd || 0) + Number(p.click || 0);
            const bal = Number(p.oylikTolov || 0) - paid;
            if (selectedStatus === 'paid' && (bal > 0 || p.isPrepaid || p.is3MonthPayment)) return false;
            if (selectedStatus === 'debt' && (paid > 0 || bal <= 0 || p.isPrepaid || p.is3MonthPayment)) return false;
            if (selectedStatus === 'partial' && (paid === 0 || bal <= 0 || p.isPrepaid || p.is3MonthPayment)) return false;
            if (selectedStatus === 'prepaid' && !p.isPrepaid && !p.is3MonthPayment) return false;
          }
          return true;
        });
      }, [payments, searchTerm, selectedGroup, selectedStatus, selectedMonth]);

      // Metrics
      const allMonthPayments = selectedMonth === 'all' ? payments : payments.filter(p => p.month === selectedMonth);
      const totalRevenue = allMonthPayments.reduce((acc, p) => acc + getTotalPaid(p), 0);
      const totalCash = allMonthPayments.reduce((acc, p) => acc + Number(p.naqd || 0) + Number(p.naqd2 || 0), 0);
      const totalClick = allMonthPayments.reduce((acc, p) => acc + Number(p.click || 0) + Number(p.click2 || 0), 0);

      const debtorsCount = allMonthPayments.filter(p => {
        const paid = getTotalPaid(p);
        const bal = Number(p.oylikTolov || 0) - paid;
        return !p.isPrepaid && !p.is3MonthPayment && paid === 0 && bal > 0;
      }).length;

      const partialCount = allMonthPayments.filter(p => {
        const paid = getTotalPaid(p);
        const bal = Number(p.oylikTolov || 0) - paid;
        return !p.isPrepaid && !p.is3MonthPayment && paid > 0 && bal > 0;
      }).length;

      const totalDebt = allMonthPayments.reduce((acc, p) => {
        if (p.isPrepaid || p.is3MonthPayment) return acc;
        const bal = Number(p.oylikTolov || 0) - getTotalPaid(p);
        return bal > 0 ? acc + bal : acc;
      }, 0);

      const currentMonthExpenses = selectedMonth === 'all'
        ? expenses
        : expenses.filter(e => e.month === selectedMonth);

      const prevMonthIdx = selectedMonth === 'all' ? -1 : months.indexOf(selectedMonth) - 1;
      const prevMonth = prevMonthIdx >= 0 ? months[prevMonthIdx] : null;
      const prevMonthExpenses = prevMonth ? expenses.filter(e => e.month === prevMonth) : [];

      const totalExpenses = currentMonthExpenses.reduce((acc, e) => acc + Number(e.amount || 0), 0);
      const staffExpensesTotal = currentMonthExpenses.filter(e => e.type === 'Kadrlar' || String(e.category || '').toLowerCase().includes('oylik')).reduce((acc, e) => acc + Number(e.amount || 0), 0);
      const centerExpensesTotal = currentMonthExpenses.filter(e => e.type === 'Markaz' || e.type === 'Fixed' || e.type === 'Marketing').reduce((acc, e) => acc + Number(e.amount || 0), 0);
      const founderExpensesTotal = currentMonthExpenses.filter(e => e.type === 'Founder' || String(e.category || '').toLowerCase().includes('founder')).reduce((acc, e) => acc + Number(e.amount || 0), 0);

      const displayedExpenses = currentMonthExpenses.filter(e => {
        if (expenseTypeFilter === 'all') return true;
        if (expenseTypeFilter === 'Founder') return e.type === 'Founder' || String(e.category || '').toLowerCase().includes('founder');
        if (expenseTypeFilter === 'Kadrlar') return e.type === 'Kadrlar' || String(e.category || '').toLowerCase().includes('oylik');
        if (expenseTypeFilter === 'Markaz') return e.type === 'Markaz' || e.type === 'Fixed' || e.type === 'Marketing';
        return true;
      });
      const prevTotalExpenses = prevMonthExpenses.reduce((acc, e) => acc + Number(e.amount || 0), 0);
      const sofFoyda = totalRevenue - totalExpenses;
      const kassoviyRazriv = totalCash - totalExpenses;

      const expenseByCategory = currentMonthExpenses.reduce((acc, e) => {
        acc[e.category] = (acc[e.category] || 0) + Number(e.amount || 0);
        return acc;
      }, {});

      // Filtered Students in Students View
      // Active Student IDs & Names for selectedMonth
      const monthStudentIds = useMemo(() => {
        if (selectedMonth === 'all') return null;
        const ids = new Set();
        const names = new Set();
        payments.forEach(p => {
          if (p.month === selectedMonth) {
            if (p.studentId) ids.add(p.studentId);
            if (p.studentName) names.add(normalizeName(p.studentName));
          }
        });
        return { ids, names };
      }, [payments, selectedMonth]);

      // Filtered Students in Students View (Scoped to selectedMonth + status & search)
      // Filtered Students in Students View (Clean Month-scoping + Status filters)
      const filteredStudentsList = useMemo(() => {
        return students.filter(s => {
          // 1. Status Filter Pills
          if (studentFilterStatus === 'active' && s.status !== 'active') return false;
          if (studentFilterStatus === 'inactive' && s.status !== 'inactive' && s.status !== 'dropped') return false;
          if (studentFilterStatus === 'paused' && s.status !== 'paused') return false;
          if (studentFilterGroup !== 'all' && s.group !== studentFilterGroup) return false;

          // 2. Search query
          if (studentSearchTerm) {
            const q = studentSearchTerm.toLowerCase();
            const matchName = s.name.toLowerCase().includes(q);
            const matchId = s.id.toLowerCase().includes(q);
            const matchPhone = (s.phone && s.phone.includes(q)) || (s.parentPhone && s.parentPhone.includes(q));
            const matchGrp = s.group && s.group.toLowerCase().includes(q);
            if (!matchName && !matchId && !matchPhone && !matchGrp) return false;
          }

          // 3. Month Scoping
          if (selectedMonth !== 'all') {
            // Active paying student in this month
            const hasPayment = monthStudentIds && (monthStudentIds.ids.has(s.id) || monthStudentIds.names.has(normalizeName(s.name)));
            if (hasPayment) return true;

            // Inactive/Dropped students recorded in system
            if (s.status === 'inactive' || s.status === 'dropped') {
              // Include all dropped students unless filtered out by status
              return true;
            }

            // Students in groups that have payments in this month
            const hasActiveGroup = allMonthPayments.some(p => p.group && p.group.toLowerCase() === (s.group || '').toLowerCase());
            if (hasActiveGroup) return true;

            return false;
          }

          return true;
        });
      }, [students, studentSearchTerm, studentFilterGroup, studentFilterStatus, selectedMonth, monthStudentIds, allMonthPayments]);

      // Filtered Groups in Groups View (Scoped to selectedMonth)
      const filteredGroupsList = useMemo(() => {
        if (selectedMonth === 'all') return groups;
        return groups.filter(g => {
          return allMonthPayments.some(p => p.group && p.group.toLowerCase() === g.name.toLowerCase()) ||
                 students.some(s => s.group && s.group.toLowerCase() === g.name.toLowerCase() && (monthStudentIds?.ids?.has(s.id) || monthStudentIds?.names?.has(normalizeName(s.name))));
        });
      }, [groups, allMonthPayments, students, monthStudentIds, selectedMonth]);

      // ==========================================
      // PAYROLL & STAFF CALCULATIONS
      // ==========================================
      const activePayrollMonth = selectedMonth !== 'all' ? selectedMonth : currentCalMonth;

      const staffPayrollSummary = useMemo(() => {
        const monthPayments = payments.filter(p => p.month === activePayrollMonth);

        return staff.map(member => {

            const teacherGroups = groups.filter(g => g.teacher && g.teacher.trim().toLowerCase() === member.name.trim().toLowerCase());
            const groupNames = teacherGroups.map(g => g.name);

            // Revenue from teacher's groups
            const groupRevenue = monthPayments
              .filter(p => groupNames.includes(p.group))
              .reduce((acc, p) => acc + getTotalPaid(p), 0);

            // Percentage salary: groupRevenue * percent / 100
            const calculatedSalary = Math.round(groupRevenue * (Number(member.percent || 0) / 100));

            // Checked against expenses for targetMonth
            const paidInExpenses = expenses
              .filter(e => e.month === activePayrollMonth && (e.recipient === member.name || (e.description && e.description.toLowerCase().includes(member.name.toLowerCase()))))
              .reduce((acc, e) => acc + Number(e.amount || 0), 0);

            return {
              ...member,
              teacherGroups,
              groupsCount: teacherGroups.length,
              groupNames,
              groupRevenue,
              calculatedSalary,
              paidInExpenses,
              balanceToPay: Math.max(0, calculatedSalary - paidInExpenses)
            };
          } else {
            // Other staff: fixed static salary
            const fixedSalary = Number(member.fixedSalary || 0);
            const paidInExpenses = expenses
              .filter(e => e.month === activePayrollMonth && (e.recipient === member.name || (e.description && e.description.toLowerCase().includes(member.name.toLowerCase()))))
              .reduce((acc, e) => acc + Number(e.amount || 0), 0);

            return {
              ...member,

              groupsCount: 0,
              groupNames: [],
              groupRevenue: 0,
              calculatedSalary: fixedSalary,
              paidInExpenses,
              balanceToPay: Math.max(0, fixedSalary - paidInExpenses)
            };

        });

      const totalCalculatedPayroll = useMemo(() => {
        return staffPayrollSummary.reduce((acc, s) => acc + (s.calculatedSalary || 0), 0);
      }, [staffPayrollSummary]);

      const totalPaidPayroll = useMemo(() => {

        return staffPayrollSummary.filter(s => {
          if (staffFilter === 'teachers' && s.role !== 'teacher') return false;
          if (staffFilter === 'staff' && s.role !== 'staff') return false;
          return true;

                    EduFinance <span className="text-emerald-400">CRM</span>

                  <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/30 font-bold flex items-center gap-1.5 shadow-sm">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Joriy: {currentCalMonth}
                  </span>
                  {supabaseConfig.url ? (
                    <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 flex items-center gap-1.5 font-medium shadow-sm">
                      <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : 'bg-emerald-400'}`}></span>
                      {isSyncing ? "Bulut bilan sinxronlanmoqda..." : "Supabase (Bulut faol)"}
                    </span>
                  ) : (
                    <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-300/90 border border-amber-500/30 flex items-center gap-1.5 font-medium">
                      <Icon name="save" className="text-xs mr-1 text-amber-400" /> Lokal rejim

                  </div>
                  <div className="pt-2 border-t border-white/[0.08] flex items-center justify-between">
                    <span className="text-xs text-slate-400 font-medium">Natija:</span>
                    <span className={`text-2xl sm:text-3xl font-black font-mono tabular-nums ${
                      sofFoyda >= 0 ? 'text-emerald-400' : 'text-rose-400'
                    }`}>
                      {sofFoyda >= 0 ? '+' : '-'}{formatMoney(Math.abs(sofFoyda))}
                    </span>
                  </div>
                </div>

                {/* Breakdown Grid: Kirim vs Chiqim */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {/* Kirimlar */}
                  <div className="p-4.5 rounded-2xl bg-slate-950/70 border border-emerald-500/30 space-y-3 shadow-lg">
                    <div className="flex items-center justify-between pb-2 border-b border-white/[0.06]">
                      <div className="text-xs font-black text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                        <Icon name="payments" className="text-sm" /> Kirimlar (Tushum)
                      </div>
                      <span className="text-xs font-mono font-black text-emerald-300">{formatMoney(totalRevenue)}</span>
                    </div>

                    <div className="space-y-2 text-xs">
                      <div className="flex justify-between items-center py-1">
                        <span className="text-slate-300 flex items-center gap-1.5">
                          <Icon name="payments" className="text-xs text-emerald-400" /> Naqd to'lovlar:
                        </span>
                        <span className="font-bold text-white font-mono tabular-nums">{formatMoney(totalCash)}</span>
                      </div>
                      <div className="flex justify-between items-center py-1">
                        <span className="text-slate-300 flex items-center gap-1.5">
                          <Icon name="credit_card" className="text-xs text-blue-400" /> Click / Karta to'lovlar:
                        </span>
                        <span className="font-bold text-white font-mono tabular-nums">{formatMoney(totalClick)}</span>
                      </div>
                      <div className="flex justify-between items-center py-1 pt-2 border-t border-white/[0.06]">
                        <span className="text-slate-400">Jami to'lovlar soni:</span>
                        <span className="font-bold text-emerald-300 font-mono tabular-nums">{allMonthPayments.length} ta</span>
                      </div>
                    </div>
                  </div>

                  {/* Chiqimlar */}
                  <div className="p-4.5 rounded-2xl bg-slate-950/70 border border-rose-500/30 space-y-3 shadow-lg">
                    <div className="flex items-center justify-between pb-2 border-b border-white/[0.06]">
                      <div className="text-xs font-black text-rose-400 uppercase tracking-wider flex items-center gap-1.5">
                        <Icon name="receipt_long" className="text-sm" /> Chiqimlar (Xarajatlar)
                      </div>
                      <span className="text-xs font-mono font-black text-rose-300">{formatMoney(totalExpenses)}</span>
                    </div>

                    <div className="space-y-2 text-xs">
                      <div className="flex justify-between items-center py-1">
                        <span className="text-slate-300 flex items-center gap-1.5">
                          <Icon name="badge" className="text-xs text-amber-400" /> Xodimlar & Ustozlar oyligi:
                        </span>
                        <span className="font-bold text-white font-mono tabular-nums">{formatMoney(staffExpensesTotal)}</span>
                      </div>
                      <div className="flex justify-between items-center py-1">
                        <span className="text-slate-300 flex items-center gap-1.5">
                          <Icon name="store" className="text-xs text-purple-400" /> Markaz operatsion xarajati:
                        </span>
                        <span className="font-bold text-white font-mono tabular-nums">{formatMoney(centerExpensesTotal)}</span>
                      </div>
                      <div className="flex justify-between items-center py-1">
                        <span className="text-slate-300 flex items-center gap-1.5">
                          <Icon name="shield_person" className="text-xs text-orange-400" /> Muassislar (Founder):
                        </span>
                        <span className="font-bold text-white font-mono tabular-nums">{formatMoney(founderExpensesTotal)}</span>
                      </div>
                      <div className="flex justify-between items-center py-1 pt-2 border-t border-white/[0.06]">
                        <span className="text-slate-400">Jami xarajatlar soni:</span>
                        <span className="font-bold text-rose-300 font-mono tabular-nums">{currentMonthExpenses.length} ta yozuv</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Solvency Status Alert */}
                <div className={`p-4 rounded-2xl border ${
                  sofFoyda >= 0
                    ? 'bg-emerald-950/30 border-emerald-500/30 text-emerald-200'
                    : 'bg-rose-950/30 border-rose-500/30 text-rose-200'
                } space-y-1.5`}>
                  <div className="text-xs font-bold flex items-center gap-2">
                    <Icon name={sofFoyda >= 0 ? "verified" : "warning"} className="text-base" />
                    <span>{sofFoyda >= 0 ? "Ijobiy Moliyaviy Natija" : "Zarar / Defitsit Holati"}</span>
                  </div>
                  <p className="text-[11px] leading-relaxed text-slate-300">
                    {sofFoyda >= 0
                      ? `Markaz ushbu davrda ijobiy sof foyda bilan ishladi. Tushum barcha operatsion xarajatlar va oyliklarni to'liq qoplab, ${formatMoney(sofFoyda)} sof daromad qoldirdi.`
                      : `Ushbu davrda xarajatlar tushumdan ${formatMoney(Math.abs(sofFoyda))} miqdorida oshib ketgan. Xarajatlarni qayta ko'rib chiqish yoki to'lovlar yig'ilishini nazorat qilish tavsiya etiladi.`}
                  </p>
                </div>

                {/* Close Button */}
                <div className="flex justify-end pt-1">
                  <button
                    onClick={() => setIsSofFoydaModalOpen(false)}
                    className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-xs shadow-lg shadow-emerald-600/30 transition-all cursor-pointer"
                  >
                    Tushunarli, Yopish
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ===== KASSOVIY RAZRIV HISOBLASH MODALI ===== */}
          {isKassoviyRazrivModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fade-in">
              <div className="w-full max-w-2xl rounded-3xl bg-slate-900 border border-cyan-500/40 p-6 sm:p-7 shadow-2xl shadow-cyan-500/20 space-y-6 max-h-[92vh] overflow-y-auto">
                {/* Header */}
                <div className="flex items-start justify-between pb-4 border-b border-white/[0.08]">
                  <div className="flex items-center gap-3.5">
                    <div className="w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 text-cyan-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                      <Icon name="bolt" className="text-2xl" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="text-lg font-black text-white">Kassoviy Razriv Tahlili</h3>
                        <span className="text-xs px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-mono font-bold">
                          {selectedMonth === 'all' ? 'Barcha oylar' : selectedMonth}
                        </span>
                      </div>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Kassadagi sof naqd pul tushumi va xarajatlarni to'lashga naqd pul yetishi yoki yetmasligi (Kassa balansi).
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsKassoviyRazrivModalOpen(false)}
                    className="w-9 h-9 rounded-xl bg-white/[0.06] hover:bg-white/[0.12] text-slate-400 hover:text-white flex items-center justify-center transition-all cursor-pointer"
                  ><Icon name="close" className="text-base" /></button>
                </div>

                {/* Highlight Formula Box */}
                <div className="p-5 rounded-2xl bg-gradient-to-br from-cyan-950/60 via-slate-950/80 to-slate-900 border border-cyan-500/40 shadow-inner space-y-3">
                  <div className="text-[11px] font-extrabold uppercase tracking-widest text-cyan-300 flex items-center gap-1.5">
                    <Icon name="calculate" className="text-sm" /> Kassoviy Razriv Formulasi
                  </div>
                  <div className="text-xs sm:text-sm text-slate-300 font-mono leading-relaxed">
                    <strong>Kassoviy Razriv</strong> = <span className="text-emerald-400 font-bold">Kassa Naqd Tushumi ({formatMoney(totalCash)})</span> − <span className="text-rose-400 font-bold">Jami Chiqimlar ({formatMoney(totalExpenses)})</span>
                  </div>
                  <div className="pt-2 border-t border-white/[0.08] flex items-center justify-between">
                    <span className="text-xs text-slate-400 font-medium">Naqd Kassa Qoldig'i (Razriv):</span>
                    <span className={`text-2xl sm:text-3xl font-black font-mono tabular-nums ${
                      kassoviyRazriv >= 0 ? 'text-cyan-400' : 'text-orange-400'
                    }`}>
                      {kassoviyRazriv >= 0 ? '+' : '-'}{formatMoney(Math.abs(kassoviyRazriv))}
                    </span>
                  </div>
                </div>

                {/* Concept Explanation Box */}
                <div className="p-4.5 rounded-2xl bg-slate-950/80 border border-white/[0.08] space-y-2">
                  <div className="text-xs font-extrabold text-white flex items-center gap-1.5">
                    <Icon name="lightbulb" className="text-amber-400 text-sm" /> Kassoviy Razriv nima va nega yuzaga keladi?
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    O'quv markazining to'lovlari ikki xil: <strong>Naqd</strong> va <strong>Click (karta)</strong> orqali tushadi. Biroq markazning xarajatlari (ijara, kundalik xarajatlar, naqd oyliklar) bevosita <strong>naqd pul kassasidan</strong> to'lanishi lozim. Agar tushgan naqd pul jami chiqimlarni qoplashga yetmasa, kassada manfiy defitsit (kassoviy razriv) paydo bo'ladi.
                  </p>
                </div>

                {/* Metric Table Comparison */}
                <div className="p-4.5 rounded-2xl bg-slate-950/70 border border-white/[0.08] space-y-2.5">
                  <div className="text-xs font-black text-white uppercase tracking-wider mb-2">Hisob-kitob tarkibi:</div>
                  
                  <div className="flex justify-between items-center text-xs py-1.5 border-b border-white/[0.06]">
                    <span className="text-slate-300 flex items-center gap-1.5">
                      <Icon name="payments" className="text-xs text-emerald-400" /> Kassaga Tushgan Naqd Pul:
                    </span>
                    <span className="font-extrabold text-emerald-400 font-mono tabular-nums">+{formatMoney(totalCash)}</span>
                  </div>

                  <div className="flex justify-between items-center text-xs py-1.5 border-b border-white/[0.06]">
                    <span className="text-slate-300 flex items-center gap-1.5">
                      <Icon name="credit_card" className="text-xs text-blue-400" /> Click / Karta Tushumi (Bank hisobida):
                    </span>
                    <span className="font-extrabold text-blue-400 font-mono tabular-nums">{formatMoney(totalClick)}</span>
                  </div>

                  <div className="flex justify-between items-center text-xs py-1.5 border-b border-white/[0.06]">
                    <span className="text-slate-300 flex items-center gap-1.5">
                      <Icon name="receipt_long" className="text-xs text-rose-400" /> Jami Amalga Oshirilgan Chiqimlar:
                    </span>
                    <span className="font-extrabold text-rose-400 font-mono tabular-nums">−{formatMoney(totalExpenses)}</span>
                  </div>

                  <div className="flex justify-between items-center text-xs py-2 pt-3 font-bold">
                    <span className="text-white">Naqd Kassa Holati:</span>
                    <span className={`text-base font-mono tabular-nums font-black ${
                      kassoviyRazriv >= 0 ? 'text-cyan-400' : 'text-orange-400'
                    }`}>
                      {kassoviyRazriv >= 0 ? 'Barqaror (Yetarli)' : `Defitsit: -${formatMoney(Math.abs(kassoviyRazriv))}`}
                    </span>
                  </div>
                </div>

                {/* Status Advice Box */}
                <div className={`p-4 rounded-2xl border ${
                  kassoviyRazriv >= 0
                    ? 'bg-cyan-950/30 border-cyan-500/30 text-cyan-200'
                    : 'bg-orange-950/30 border-orange-500/30 text-orange-200'
                } space-y-1.5`}>
                  <div className="text-xs font-bold flex items-center gap-2">
                    <Icon name={kassoviyRazriv >= 0 ? "verified" : "warning"} className="text-base" />
                    <span>{kassoviyRazriv >= 0 ? "Kassada Naqd Pul Yetarli" : "Kassoviy Razriv Xavfi (Naqd Defitsiti)"}</span>
                  </div>
                  <p className="text-[11px] leading-relaxed text-slate-300">
                    {kassoviyRazriv >= 0
                      ? `Kassaga tushgan naqd pul barcha chiqimlarni to'lashga to'liq yetgan. Kassada ortiqcha naqd mablag' mavjud, defitsit xavfi yo'q.`
                      : `Kassada ${formatMoney(Math.abs(kassoviyRazriv))} naqd pul yetishmovchiligi mavjud. Garchi markazda Click hisobida ${formatMoney(totalClick)} bo'lsa ham, naqd pul kassasi defitsitda. Tavsiya: bank kartasidagi Click mablag'laridan naqdlashtirib kassa balansini to'ldirish lozim.`}
                  </p>
                </div>

                {/* Close Button */}
                <div className="flex justify-end pt-1">
                  <button
                    onClick={() => setIsKassoviyRazrivModalOpen(false)}
                    className="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black text-xs shadow-lg shadow-cyan-600/30 transition-all cursor-pointer"
                  >
                    Tushunarli, Yopish
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ===== TOAST NOTIFICATION ===== */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 px-4.5 py-3 rounded-2xl bg-slate-900/95 backdrop-blur-xl text-emerald-400 border border-emerald-500/40 text-xs font-bold shadow-2xl flex items-center gap-2.5 transition-all animate-fade-in">
              
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("EduFinance React Error caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
              <div className="max-w-lg w-full bg-slate-900 border border-rose-500/30 rounded-3xl p-8 shadow-2xl text-center space-y-4">
                <div className="w-14 h-14 mx-auto rounded-2xl bg-rose-500/20 text-rose-400 border border-rose-500/40 flex items-center justify-center text-2xl font-bold">
                  !
                </div>
                <h2 className="text-xl font-black text-white">Xatolik yuz berdi</h2>
                <p className="text-xs text-slate-400">
                  Tizimda kutilmagan holat yuz berdi. Sahifani qayta yangilang yoki keshni tozalang.
                </p>
                <div className="p-3 rounded-xl bg-slate-950 border border-white/[0.08] text-[11px] font-mono text-rose-300 text-left overflow-auto max-h-36">
                  {this.state.error ? this.state.error.toString() : 'Noma\'lum xatolik'}
                </div>
                <div className="flex gap-3 pt-2">
                  <button
                    onClick={() => window.location.reload()}
                    className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all shadow-lg shadow-emerald-600/30 cursor-pointer"
                  >
                    Sahifani Yangilash
                  </button>
                  <button
                    onClick={() => { localStorage.clear(); window.location.reload(); }}
                    className="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-750 text-rose-300 text-xs font-bold transition-all cursor-pointer"
                  >
                    Keshni tozalash
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
