<body class="bg-slate-950 text-slate-100 selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { 
      PieChart, Pie, Cell, ResponsiveContainer, Tooltip, Legend,
      LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid 
    } = window.Recharts || {};

    // Professional Material Symbols Icon Component
    const Icon = ({ name, className = '', style = {} }) => (
      <span className={`material-symbols-outlined select-none shrink-0 ${className}`} style={style}>
        {name}
      </span>
    );

    // Uzbek Month Names & Auto Calendar System
    const UZ_MONTHS = [
      'Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun',
      'Iyul', 'Avgust', 'Sentyabr', 'Oktabr', 'Noyabr', 'Dekabr'
    ];

    const MONTH_ICONS = {
      'Yanvar': 'calendar_today', 'Fevral': 'calendar_today', 'Mart': 'calendar_today', 'Aprel': 'calendar_today',
      'May': 'calendar_today', 'Iyun': 'calendar_today', 'Iyul': 'calendar_today', 'Avgust': 'calendar_today',
      'Sentyabr': 'calendar_today', 'Oktabr': 'calendar_today', 'Noyabr': 'calendar_today', 'Dekabr': 'calendar_today'
    };

    const getCurrentMonthString = () => {
      const now = new Date();
      return `${UZ_MONTHS[now.getMonth()]} ${now.getFullYear()}`;
    };

    const getMonthIcon = (mStr) => {
      if (!mStr) return 'calendar_month';
      const mName = mStr.split(' ')[0];
      return MONTH_ICONS[mName] || 'calendar_month';
    };

    const getNextMonthString = (monthStr) => {
      if (!monthStr) return getCurrentMonthString();
      const parts = monthStr.trim().split(' ');
      const mName = parts[0];
      let year = parseInt(parts[1], 10) || new Date().getFullYear();
      let idx = UZ_MONTHS.indexOf(mName);
      if (idx === -1) idx = new Date().getMonth();
      idx += 1;
      if (idx >= 12) {
        idx = 0;
        year += 1;
      }
      return `${UZ_MONTHS[idx]} ${year}`;
    };

    const formatUzbekPhone = (raw) => {
      if (!raw) return '+998 ';
      const str = String(raw).trim();
      if (str === '-' || str === '--' || str === 'yo\'q' || str === 'yuq' || str === 'none') return '+998 ';
      const digits = str.replace(/\D/g, '');
      if (digits.length === 9) {
        return `+998 ${digits.slice(0, 2)} ${digits.slice(2, 5)} ${digits.slice(5, 7)} ${digits.slice(7, 9)}`;
      }
      if (digits.length === 12 && digits.startsWith('998')) {
        const d = digits.slice(3);
        return `+998 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5, 7)} ${d.slice(7, 9)}`;
      }
      if (str.startsWith('+998')) return str;
      if (digits.length > 0) return `+998 ${digits}`;
      return '+998 ';
    };

    // Random Student ID Generator (e.g. STU-4921)
    const generateStudentId = () => {
      return 'STU-' + Math.floor(1000 + Math.random() * 9000);
    };

    // Helper Formatters
    const formatMoney = (amount) => {
      if (amount === undefined || amount === null || isNaN(amount)) return "0 so'm";
      const num = Math.round(Number(amount));
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
        return dateStr;
      } catch (e) { return dateStr; }
    };

    const getTodayInputFormat = () => new Date().toISOString().split('T')[0];

    const getTotalPaid = (p) => {
      return Number(p.naqd || 0) + Number(p.click || 0) + Number(p.naqd2 || 0) + Number(p.click2 || 0);
    };

    const getStatusInfo = (payment) => {
      const { isPrepaid, is3MonthPayment, oylikTolov = 0, depozitBalansi = 0 } = payment;
      const totalPaid = getTotalPaid(payment);
      const balance = Number(oylikTolov) - totalPaid;

      if (isPrepaid) {
        return { 
          label: `Oldindan to'langan (Depozit: ${formatMoney(depozitBalansi)})`,
          shortLabel: `Oldindan (Depozit: ${formatMoney(depozitBalansi)})`,
          bgClass: 'bg-cyan-500/10 text-cyan-300 border-cyan-500/30', 
          dotClass: 'bg-cyan-400' 
        };
      }
      if (is3MonthPayment || (oylikTolov > 0 && totalPaid >= oylikTolov * 3)) {
        return { 
          label: `3 Oylik (Qolgan depozit: ${formatMoney(depozitBalansi)})`, 
          shortLabel: `3 Oylik (Depozit: ${formatMoney(depozitBalansi)})`,
          bgClass: 'bg-purple-500/10 text-purple-300 border-purple-500/30', 
          dotClass: 'bg-purple-400' 
        };
      }
      if (balance <= 0 && totalPaid > 0) {
        return { label: "To'ladi", shortLabel: "To'ladi", bgClass: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30', dotClass: 'bg-emerald-400' };
      }
      if (totalPaid > 0 && balance > 0) {
        return { label: "Qisman", shortLabel: "Qisman", bgClass: 'bg-amber-500/10 text-amber-300 border-amber-500/30', dotClass: 'bg-amber-400' };
      }
      return { label: "Qarzdor", shortLabel: "Qarzdor", bgClass: 'bg-rose-500/10 text-rose-300 border-rose-500/30', dotClass: 'bg-rose-400' };
    };

    // Helper: Auto-expand numbers entered in 'thousands' (e.g. 500 -> 500000)
    const autoExpandThousand = (val) => {
      if (val === '' || val === null || val === undefined) return 0;
      const clean = String(val).replace(/\s/g, '').replace(/,/g, '');
      const num = Number(clean);
      if (isNaN(num) || num <= 0) return 0;
      // If user enters number < 10000 (e.g. 500, 750, 1200, 35) -> multiply by 1000:
      if (num < 10000) {
        return num * 1000;
      }
      return num;
    };

    // Aqlli guruh nomini normalizatsiya qilish (AI -2 -> AI-2, java 10 -> Java-10, FS -4 -> Fullstack-4)
    const cleanGroupName = (raw) => {
      if (!raw) return 'Asosiy guruh';
      let g = String(raw).trim();
      g = g.replace(/[\(\)\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
      g = g.replace(/([A-Za-z]+)\s*-\s*(\d+)/gi, '$1-$2');
      g = g.replace(/([A-Za-z]+)\s+(\d+)/gi, '$1-$2');
      if (/^fs-?\d+/i.test(g)) g = g.replace(/^fs-?/i, 'Fullstack-');
      else if (/^front-?\d+/i.test(g)) g = g.replace(/^front-?/i, 'Frontend-');
      else if (/^ai-?\d+/i.test(g)) g = g.replace(/^ai-?/i, 'AI-');
      else if (/^python-?\d+/i.test(g)) g = g.replace(/^python-?/i, 'Python-');
      else if (/^java-?\d+/i.test(g)) g = g.replace(/^java-?/i, 'Java-');
      return g.charAt(0).toUpperCase() + g.slice(1);
    };

    // O'zbek ism-familiyalarini chuqur fonetik va tokenlar bo'yicha tahlil qilish (LIKE & Fuzzy Match)
    const normalizeToken = (t) => {
      if (!t) return '';
      let s = String(t).toLowerCase().replace(/[`'ʻ’ʼ\.\-_]/g, '').trim();
      if (s.length > 5) {
        if (s.endsWith('bek')) s = s.slice(0, -3);
        else if (s.endsWith('jon')) s = s.slice(0, -3);
        else if (s.endsWith('xon')) s = s.slice(0, -3);
        else if (s.endsWith('boy')) s = s.slice(0, -3);
      }
      if (s.endsWith('yeva') || s.endsWith('ieva')) s = s.slice(0, -4);
      else if (s.endsWith('yev') || s.endsWith('iev')) s = s.slice(0, -3);
      else if (s.endsWith('ova') || s.endsWith('eva')) s = s.slice(0, -3);
      else if (s.endsWith('ov') || s.endsWith('ev')) s = s.slice(0, -2);
      else if (s.endsWith('zoda') || s.endsWith('zade')) s = s.slice(0, -4);
      s = s.replace(/kh/g, 'x').replace(/gh/g, 'g').replace(/sh/g, 's').replace(/ch/g, 'c');
      s = s.replace(/^ish/, 'esh').replace(/^il/, 'el');
      s = s.replace(/[hxqkg]/g, 'k');
      s = s.replace(/[aoeiu]/g, '#');
      return s;
    };

    const getTokens = (name) => {
      if (!name) return [];
      return String(name).trim().split(/\s+/).filter(w => w.length > 1);
    };

    // Ism-familiya o'rni almashgan (Rajabov Diyorbek <-> Diyorbek Rajabov), harf xatolari va LIKE moslikni tekshirish
    const isNameMatch = (nameA, nameB) => {
      if (!nameA || !nameB) return false;
      const rawA = String(nameA).toLowerCase().replace(/[`'ʻ’ʼ\s]/g, '').trim();
      const rawB = String(nameB).toLowerCase().replace(/[`'ʻ’ʼ\s]/g, '').trim();
      if (rawA === rawB) return true;
      const tokensA = getTokens(nameA);
      const tokensB = getTokens(nameB);
      if (tokensA.length === 0 || tokensB.length === 0) return false;
      const normA = tokensA.map(normalizeToken).filter(Boolean).sort();
      const normB = tokensB.map(normalizeToken).filter(Boolean).sort();
      if (normA.join(' ') === normB.join(' ')) return true;
      if (normA.length >= 2 && normB.length >= 2) {
        if (normA.every(t => normB.includes(t)) || normB.every(t => normA.includes(t))) return true;
      }
      if (rawA.length >= 6 && rawB.length >= 6) {
        if (rawA.includes(rawB) || rawB.includes(rawA)) return true;
      }
      return false;
    };

    // Standard Expense Categories
    const EXPENSE_CATEGORIES = [
      'Founder harajatlari',
      'Oqituvchilar oyligi',
      'Xodimlar oyligi',
      'Reklama va Target',
      'Markaz xarajatlari',
      'Kommunal va Ijara',
      'Jihozlar va texnika',
      'Boshqa'
    ];

    // Default Seed Data: Staff (Ustozlar & Xodimlar)
    const DEFAULT_STAFF = [];

    // Default Seed Data: Groups
    const DEFAULT_GROUPS = [];

    // Default Seed Data: Students (Added Once, has unique random ID)
    const DEFAULT_STUDENTS = [];

    // Default Seed Data: Months
    const DEFAULT_MONTHS = ['Avgust 2026', 'Sentyabr 2026'];

    // Default Seed Data: Payments
    const DEFAULT_PAYMENTS = [];

    const DEFAULT_EXPENSES = [];

    // Excel Exporter
    const exportExcelFn = async (payments, expenses, currentMonth) => {
      if (!window.ExcelJS) return alert("ExcelJS yuklanmoqda...");
      const workbook = new window.ExcelJS.Workbook();
      workbook.creator = 'EduFinance CRM';

      const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } };
      const headerFont = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
      const borderStyle = {
        top: { style: 'thin', color: { argb: 'CBD5E1' } },
        left: { style: 'thin', color: { argb: 'CBD5E1' } },
        bottom: { style: 'thin', color: { argb: 'CBD5E1' } },
        right: { style: 'thin', color: { argb: 'CBD5E1' } }
      };
      const currencyFormat = '#,##0 "so\'m"';

      const wsP = workbook.addWorksheet("To'lovlar bazasi");
      wsP.columns = [
        { header: 'ID', key: 'id', width: 12 },
        { header: 'Student ID', key: 'studentId', width: 14 },
        { header: 'I.F.O (O\'quvchi)', key: 'studentName', width: 25 },
        { header: 'Telefon (O\'zi)', key: 'phoneStudent', width: 18 },
        { header: 'Telefon (Oilasi)', key: 'phoneParent', width: 18 },
        { header: 'Oylik To\'lov', key: 'oylikTolov', width: 16 },
        { header: 'Naqd', key: 'naqd', width: 14 },
        { header: 'Click', key: 'click', width: 14 },
        { header: 'Bitta to\'liq summa', key: 'bittaToliqSumma', width: 18 },
        { header: 'Qolgan Depozit', key: 'depozitBalansi', width: 20 },
        { header: 'Qoldiq Qarz', key: 'qoldiq', width: 16 },
        { header: 'Status', key: 'status', width: 16 },
        { header: 'Guruhlar / Yo\'nalish', key: 'group', width: 22 },
        { header: 'To\'lov Sanasi', key: 'paymentDate', width: 15 },
        { header: 'Oy', key: 'month', width: 15 },
        { header: 'Izoh', key: 'note', width: 30 }
      ];
      wsP.getRow(1).eachCell(c => { c.fill = headerFill; c.font = headerFont; });

      payments.forEach((p, idx) => {
        const rIdx = idx + 2;
        let statusText = p.isPrepaid ? "Oldindan to'langan" : p.is3MonthPayment ? "3 Oylik (To'liq)" : (Number(p.naqd || 0) + Number(p.click || 0) <= 0) ? "Qarzdor" : "To'ladi";
        const row = wsP.addRow({
          ...p,
          qoldiq: { formula: `=F${rIdx}-(G${rIdx}+H${rIdx})` },
          status: statusText
        });
        ['oylikTolov','naqd','click','bittaToliqSumma','depozitBalansi','qoldiq'].forEach(k => {
          if (row.getCell(k)) row.getCell(k).numFmt = currencyFormat;
        });
        row.eachCell(c => c.border = borderStyle);
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      saveAs(blob, `Oquv_Markaz_Moliya_CRM_${new Date().toISOString().split('T')[0]}.xlsx`);
    };

    // =======================================================================
    // ========================================================================
    // Universal Excel Import Parser Engine (May, Iyun, Iyul, Avgust)
    // ========================================================================
    const parseUzbekMoney = (val) => {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') {
        if (val > 0 && val < 10000) return val * 1000;
        return val;
      }
      let str = String(val).trim().replace(/\s+/g, '');
      if (str === '-' || str === '--') return 0;
      const isNegative = str.startsWith('-');
      str = str.replace(/^-+/, '');
      
      // If ends with .000 or ,000 e.g. 650.000 or 75,279.000
      if (str.endsWith('.000') || str.endsWith(',000')) {
        str = str.replace(/[.,]000$/, '000');
        str = str.replace(/[.,]/g, '');
      } else {
        str = str.replace(/[.,\s]/g, '');
      }
      let num = parseFloat(str) || 0;
      if (isNegative) num = -num;
      if (num > 0 && num < 10000) num *= 1000;
      return num;
    };

    const formatIsoDateSafe = (val, defaultYear = 2026) => {
      if (!val) return getTodayInputFormat();
      let str = String(val).trim();

      // Excel serial date (e.g. 46143)
      if (typeof val === 'number' || /^\d{4,6}(\.\d+)?$/.test(str)) {
        const serial = typeof val === 'number' ? val : parseFloat(str);
        const utcDays = Math.floor(serial - 25569);
        const dateObj = new Date(utcDays * 86400 * 1000);
        if (!isNaN(dateObj.getTime())) {
          const y = dateObj.getUTCFullYear();
          const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
          const d = String(dateObj.getUTCDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
      }

      // 1. Agar YYYY-MM-DD yoki YYYY-DD-MM (masalan 2026-13-05 yoki 2026-05-13)
      const ymd = str.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (ymd) {
        let y = parseInt(ymd[1], 10);
        let m = parseInt(ymd[2], 10);
        let d = parseInt(ymd[3], 10);
        // Agar oy 12 dan katta bo'lsa va kun 12 dan kichik bo'lsa, o'rinlari almashgan:
        if (m > 12 && d <= 12) {
          const t = m;
          m = d;
          d = t;
        }
        if (m < 1 || m > 12) m = 5;
        if (d < 1 || d > 31) d = 1;
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      // 2. Agar DD-MM-YYYY yoki MM-DD-YYYY yoki DD.MM.YY (masalan 13.05.2026 yoki 05/13/2026)
      const dmy = str.match(/^(\d{1,2})[-/.,](\d{1,2})[-/.,](\d{2,4})/);
      if (dmy) {
        let p1 = parseInt(dmy[1], 10);
        let p2 = parseInt(dmy[2], 10);
        let y = dmy[3];
        if (y.length === 2) y = '20' + y;
        let numY = parseInt(y, 10);

        let m, d;
        if (p1 > 12 && p2 <= 12) {
          d = p1; m = p2;
        } else if (p2 > 12 && p1 <= 12) {
          d = p2; m = p1;
        } else if (str.includes('/') && p1 <= 12 && numY > 2000) {
          m = p1; d = p2;
        } else {
          d = p1; m = p2;
        }

        if (m < 1 || m > 12) m = 5;
        if (d < 1 || d > 31) d = 1;
        return `${numY}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      // 3. Matnli oylar: '5-May', '13-May', '9-Jun'
      const monthNamesShort = {
        'jan': '01', 'yan': '01', 'feb': '02', 'fev': '02', 'mar': '03',
        'apr': '04', 'may': '05', 'jun': '06', 'iyun': '06', 'jul': '07',
        'iyul': '07', 'aug': '08', 'avg': '08', 'sep': '09', 'sen': '09',
        'oct': '10', 'okt': '10', 'nov': '11', 'noy': '11', 'dec': '12', 'dek': '12'
      };
      const namedMatch = str.match(/^(\d{1,2})[-/ ]([a-zA-Z]{3,4})([-/ ](\d{2,4}))?$/);
      if (namedMatch) {
        const d = parseInt(namedMatch[1], 10);
        const mName = namedMatch[2].toLowerCase();
        const m = parseInt(monthNamesShort[mName] || '5', 10);
        let y = namedMatch[4] || defaultYear;
        if (String(y).length === 2) y = '20' + y;
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      // Standart Date
      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        return parsed.toISOString().split('T')[0];
      }

      return getTodayInputFormat();
    };

      const handleDeduplicateStudentsAndGroups = () => {
        if (students.length === 0) {

        const canonicalStudents = [];
        const studentIdRedirectMap = {}; // oldId -> canonicalId

        for (const s of students) {
          const existing = canonicalStudents.find(cs => isNameMatch(cs.name, s.name) || (cs.phone && s.phone && s.phone.length > 8 && cs.phone.replace(/\D/g, '') === s.phone.replace(/\D/g, '')));
          if (!existing) {
            canonicalStudents.push({ ...s, group: cleanGroupName(s.group) });
            studentIdRedirectMap[s.id] = s.id;
          } else {
            studentIdRedirectMap[s.id] = existing.id;
            // Ma'lumotlarni boyitish
            if ((!existing.phone || existing.phone === '+998 ') && s.phone && s.phone !== '+998 ') existing.phone = s.phone;
            if ((!existing.parentPhone || existing.parentPhone === '+998 ') && s.parentPhone && s.parentPhone !== '+998 ') existing.parentPhone = s.parentPhone;
            if ((!existing.monthlyFee || existing.monthlyFee === 0) && s.monthlyFee > 0) existing.monthlyFee = s.monthlyFee;
            if (s.name.length > existing.name.length && s.name.includes(' ')) existing.name = formatProperName(s.name);
          }
        }

        // 2. Guruhlarni birlashtirish (AI -2 va AI-2 kabilarni bitta guruh qilish)
        const canonicalGroups = [];
        const groupNameMap = {}; // oldGroupName -> canonicalGroupName

        for (const g of groups) {
          const cName = cleanGroupName(g.name);
          groupNameMap[g.name] = cName;
          const exGrp = canonicalGroups.find(cg => cg.name.toLowerCase() === cName.toLowerCase());
          if (!exGrp) {
            canonicalGroups.push({ ...g, name: cName });
          } else {
            if (g.fee > 0 && (!exGrp.fee || exGrp.fee === 0)) exGrp.fee = g.fee;
            if (g.teacher && (!exGrp.teacher || exGrp.teacher === 'Asosiy Ustoz')) exGrp.teacher = g.teacher;
          }
        }

        const updatedPaymentsList = payments.map(p => {
          const targetStudentId = studentIdRedirectMap[p.studentId] || p.studentId;
          const canonicalStu = canonicalStudents.find(cs => cs.id === targetStudentId || isNameMatch(cs.name, p.studentName));
          return {
            ...p,
            studentId: canonicalStu ? canonicalStu.id : targetStudentId,
            studentName: canonicalStu ? canonicalStu.name : formatProperName(p.studentName),
            group: groupNameMap[p.group] || cleanGroupName(p.group)

        });

      const handleExcelFileSelect = async (event) => {

        }

        setIsExcelLoading(true);

          const workbook = window.XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
          const sheetNames = workbook.SheetNames;

          // Fayl nomi yoki listlardan taxminiy oyni aniqlash
          let predictedMonth = selectedMonth;
          const fileNameLower = file.name.toLowerCase();
          const uzMonthsList = [
            { key: 'may', name: 'May 2026' },
            { key: 'iyun', name: 'Iyun 2026' },
            { key: 'iyul', name: 'Iyul 2026' },
            { key: 'avgust', name: 'Avgust 2026' },
            { key: 'sentyabr', name: 'Sentyabr 2026' },
            { key: 'oktabr', name: 'Oktabr 2026' },
            { key: 'noyabr', name: 'Noyabr 2026' },
            { key: 'dekabr', name: 'Dekabr 2026' },
            { key: 'yanvar', name: 'Yanvar 2026' },
            { key: 'fevral', name: 'Fevral 2026' },
            { key: 'mart', name: 'Mart 2026' },
            { key: 'aprel', name: 'Aprel 2026' }
          ];

          for (const m of uzMonthsList) {
            if (fileNameLower.includes(m.key) || sheetNames.some(s => s.toLowerCase().includes(m.key))) {
              predictedMonth = m.name;
              break;
            }
          }

          setSelectedUploadMonth(predictedMonth);
          setPendingExcelUpload({
            file,
            workbook,
            sheetNames,
            fileName: file.name
          });
          setIsMonthSelectModalOpen(true);
        } catch (err) {
          console.error("Excel faylni o'qishda xatolik:", err);
          alert("Excel faylni ochishda xatolik: " + err.message);
        } finally {
          setIsExcelLoading(false);
          event.target.value = '';
        }
      };

      // ==========================================
      // STEP 2: OY TANLANGANDAN SO'NG BARCHA FORMATLARNI PARSLASH
      // (Avgust, Iyul, Iyun, May 4 xil strukturasiga 100% mos va Dublikatsiyaga qarshi)
      // ==========================================
      const executeExcelImportWithMonth = () => {
        if (!pendingExcelUpload) return;
        const targetMonth = (customMonthInput && customMonthInput.trim()) ? customMonthInput.trim() : selectedUploadMonth;
        const { workbook, sheetNames, fileName } = pendingExcelUpload;

        setIsMonthSelectModalOpen(false);
        setIsExcelLoading(true);

        // Har bir yangi yozuv uchun mutlaqo unikal ID generatorlari (PostgreSQL collision oldini olish)
        let localExpCounter = 0;
        let localPayCounter = 0;
        let localGrpCounter = 0;
        let localStfCounter = 0;
        const makeExpId = () => `EXP-${Date.now().toString(36)}-${++localExpCounter}-${Math.random().toString(36).substring(2, 7)}`;
        const makePayId = () => `PAY-${Date.now().toString(36)}-${++localPayCounter}-${Math.random().toString(36).substring(2, 7)}`;
        const makeGrpId = () => `GRP-${Date.now().toString(36)}-${++localGrpCounter}-${Math.random().toString(36).substring(2, 7)}`;
        const makeStfId = () => `STF-${Date.now().toString(36)}-${++localStfCounter}-${Math.random().toString(36).substring(2, 7)}`;

        try {
          // Listlarni aniqlash (Standart shablon va eski oylar uchun)
          const paySheetName = sheetNames.find(s => {
            const l = s.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
            return l.includes("to'lov") || l.includes('tolov') || l.includes('may') || l.includes('talaba');
          });

          // 1. O'qituvchilar / Kadrlar oyligi varag'i (Shablonda alohida varaq)
          const salarySheetName = sheetNames.find(s => {
            const l = s.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
            return l.includes("o'qituvchi") || l.includes("oqituvchi") || l.includes("ustoz") || l.includes("kadr") || 
                   ((l.includes("oylig") || l.includes("maosh") || l.includes("oylik")) && !l.includes("to'lov") && !l.includes("tolov"));
          });

          // 2. Markaz xarajatlari varag'i (Shablonda alohida varaq)
          const centerExpSheetName = sheetNames.find(s => {
            const l = s.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
            return (l.includes("markaz") && (l.includes("xarajat") || l.includes("chiqim") || l.includes("rasxod"))) ||
                   (l.includes("operatsion") && l.includes("xarajat"));
          });

          // 3. Founder xarajatlari varag'i (Shablonda alohida varaq)
          const founderExpSheetName = sheetNames.find(s => {
            const l = s.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
            return l.includes("founder") || l.includes("ta'sischi") || l.includes("tasischi") || l.includes("dividend");
          });

          // 4. Umumiy / Eski xarajatlar varag'i (Avgust xarajat, Xarajatlar, Rasxod)
          const legacyExpSheetName = sheetNames.find(s => {
            const l = s.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
            return !l.includes("founder") && !l.includes("ta'sischi") && !l.includes("tasischi") && (l.includes('xarajat') || l.includes('rasxod') || l.includes('chiqim'));
          });

          const kitSheetName = sheetNames.find(s => {
            const l = s.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
            return l.includes('oshxona') || l.includes('obed');
          });
          const clkSheetName = sheetNames.find(s => {
            const l = s.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
            return l.includes('clisk') || l.includes('click');
          });

          const paymentsSheet = paySheetName ? workbook.Sheets[paySheetName] : (sheetNames[0] ? workbook.Sheets[sheetNames[0]] : null);
          const salarySheet = salarySheetName ? workbook.Sheets[salarySheetName] : null;
          const centerExpSheet = centerExpSheetName ? workbook.Sheets[centerExpSheetName] : null;
          const founderExpSheet = founderExpSheetName ? workbook.Sheets[founderExpSheetName] : null;
          const expensesSheet = legacyExpSheetName ? workbook.Sheets[legacyExpSheetName] : (sheetNames[1] ? workbook.Sheets[sheetNames[1]] : null);
          const kitchenSheet = kitSheetName ? workbook.Sheets[kitSheetName] : null;
          const clickSheet = clkSheetName ? workbook.Sheets[clkSheetName] : null;

          let newPaymentsCount = 0;
          let newStudentsCount = 0;
          let matchedStudentsCount = 0;
          let droppedStudentsCount = 0;
          let newExpensesCount = 0;
          let newStaffCount = 0;
          let totalImportedIncome = 0;
          let totalImportedExpense = 0;
          let debtorsCount = 0;
          let manOlmaganmanCount = 0;

          const updatedStudents = [...students];
          const updatedGroups = [...groups];
          const updatedStaff = [...staff];

          // Agar replaceExistingData tanlangan bo'lsa, ushbu oydagi to'lov va xarajatlarni tozalaymiz
          let updatedPayments = replaceExistingData 
            ? payments.filter(p => p.month !== targetMonth) 
            : [...payments];
          let updatedExpenses = replaceExistingData 
            ? expenses.filter(e => e.month !== targetMonth) 
            : [...expenses];

          const updatedMonths = months.includes(targetMonth) ? [...months] : [...months, targetMonth];

          // A) Oshxona ma'lumotlarini o'qish (Ustozlar tushligi)
          const kitchenTotals = {};
          if (kitchenSheet) {
            const kRows = window.XLSX.utils.sheet_to_json(kitchenSheet, { header: 1, raw: false });
            let kHeader = -1;
            for (let r = 0; r < Math.min(kRows.length, 6); r++) {
              if (kRows[r] && kRows[r].some(c => String(c).trim() === '1' || String(c).trim() === '01')) {
                kHeader = r;
                break;
              }
            }
            const kStart = kHeader >= 0 ? kHeader + 1 : 1;
            for (let i = kStart; i < kRows.length; i++) {
              const row = kRows[i];
              if (!row || !row[0]) continue;
              const fio = String(row[0]).trim();
              if (fio.toLowerCase().startsWith('jami') || fio.toLowerCase().startsWith('total')) continue;
              let jamiK = 0;
              for (let d = 1; d <= 31; d++) {
                const cell = row[d];
                if (cell && String(cell).toUpperCase() !== 'X' && String(cell).toUpperCase() !== 'Х') {
                  jamiK += parseUzbekMoney(cell);
                }
              }
              const explicitJ = parseUzbekMoney(row[32] || row[row.length - 1]);
              kitchenTotals[normalizeName(fio)] = explicitJ > 0 ? explicitJ : jamiK;
            }
          }

          // B) Kirim moduli: To'lovlar va O'quvchilarni tahlil qilish
          if (paymentsSheet) {
            const pRows = window.XLSX.utils.sheet_to_json(paymentsSheet, { header: 1, raw: false });
            
            // Formatni aniqlash
            let isMayFormat = false;
            let headerRowIdx = -1;

            for (let r = 0; r < Math.min(pRows.length, 10); r++) {
              const row = pRows[r] || [];
              const rowStr = row.map(c => String(c || '').toLowerCase()).join(' ');
              if (rowStr.includes("to'lov qilingan sana") || rowStr.includes("to`lov qilingan sana") || (rowStr.includes("o'quvchilar i.f.o") && rowStr.includes("to'lov turi"))) {
                isMayFormat = true;
                headerRowIdx = r;
                break;
              }
              if (rowStr.includes('i.f.o') || rowStr.includes('f.i.o') || rowStr.includes("o'quvchi") || rowStr.includes('oquvchi')) {
                headerRowIdx = r;
                break;
              }
            }

            const pStart = headerRowIdx >= 0 ? headerRowIdx + 1 : 1;

            if (isMayFormat) {
              // --- MAY OYI FORMATI (Kirim: May oyi uchun + Iyun oyi oldindan to'lov) ---
              for (let i = pStart; i < pRows.length; i++) {
                const row = pRows[i];
                if (!row || row.length === 0) continue;
                let rawName = String(row[1] || '').trim();
                if ((/^\d+$/.test(rawName) || !rawName) && row[0] && typeof row[0] === 'string' && !/^\d+$/.test(row[0])) {
                  rawName = String(row[0]).trim();
                }
                if (!rawName || rawName.toLowerCase().startsWith('jami') || rawName.toLowerCase().startsWith('total') || rawName.toLowerCase().includes("o'quvchilar") || rawName.toLowerCase().includes("o`quvchilar") || rawName.toLowerCase().includes('i.f.o')) continue;

                const norm = normalizeName(rawName);
                const dateStr = parseExcelDateInBrowser(row[0]) || getTodayInputFormat();
                const sumMay = parseUzbekMoney(row[2]);
                const sumIyun = parseUzbekMoney(row[3]);
                const paySum = (sumMay > 0 ? sumMay : 0) + (sumIyun > 0 ? sumIyun : 0);
                if (paySum <= 0) continue;

                const payTypeStr = String(row[4] || '').toLowerCase();
                const isClick = payTypeStr.includes('click') || payTypeStr.includes('clisk');
                const naqd = isClick ? 0 : paySum;
                const click = isClick ? paySum : 0;
                const oylikTolov = sumMay > 0 ? sumMay : (sumIyun > 0 ? sumIyun : 750000);

                // Student deduplication
                let existingStudent = updatedStudents.find(s => isNameMatch(s.name, rawName) || (studentPhone && s.phone && studentPhone.length > 7 && s.phone.includes(studentPhone.replace(/\D/g, ''))));
                const assignedGroup = existingStudent && existingStudent.group ? existingStudent.group : 'Asosiy guruh';

                if (!existingStudent) {
                  existingStudent = {
                    id: generateStudentId(),
                    name: formatProperName(rawName),
                    phone: '+998 ',
                    parentPhone: '+998 ',
                    group: assignedGroup,
                    monthlyFee: oylikTolov,
                    status: 'active',
                    joinedDate: dateStr
                  };
                  updatedStudents.push(existingStudent);
                  newStudentsCount++;
                } else {
                  matchedStudentsCount++;
                  if ((!existingStudent.monthlyFee || existingStudent.monthlyFee === 0) && oylikTolov > 0) {
                    existingStudent.monthlyFee = oylikTolov;
                  }
                }

                // Guruh tekshiruvi
                if (!updatedGroups.some(g => cleanGroupName(g.name).toLowerCase() === assignedGroup.toLowerCase())) {
                  updatedGroups.push({
                    id: makeGrpId(),
                    name: assignedGroup,
                    category: 'Dasturlash',
                    fee: oylikTolov,
                    teacher: 'Asosiy Ustoz',
                    days: 'Dush-Chor-Jum (14:00)',
                    room: '1-Xona'
                  });
                }

                totalImportedIncome += paySum;

                const noteText = (sumIyun > 0 && sumMay > 0) 
                  ? `May: ${formatMoney(sumMay)}, Iyun: ${formatMoney(sumIyun)}` 
                  : (sumIyun > 0 ? "Iyun oyi uchun oldindan to'lov" : (payTypeStr ? `To'lov turi: ${row[4]}` : ''));

                // Payment deduplication
                let existingPay = updatedPayments.find(p => p.month === targetMonth && (p.studentId === existingStudent.id || normalizeName(p.studentName) === norm));
                if (existingPay) {
                  existingPay.naqd = naqd;
                  existingPay.click = click;
                  existingPay.oylikTolov = oylikTolov;
                  existingPay.paymentType = isClick ? 'Click' : 'Naqd';
                  existingPay.paymentDate = dateStr;
                  if (noteText) existingPay.note = noteText;
                } else {
                  updatedPayments.push({
                    id: makePayId(),
                    studentId: existingStudent.id,
                    studentName: existingStudent.name,
                    phoneStudent: '+998 ',
                    phoneParent: '+998 ',
                    oylikTolov,
                    naqd,
                    click,
                    group: assignedGroup,
                    paymentDate: dateStr,
                    month: targetMonth,
                    paymentType: isClick ? 'Click' : 'Naqd',
                    note: noteText,
                    is3MonthPayment: false,
                    bittaToliqSumma: 0,
                    depozitBalansi: 0,
                    isPrepaid: sumIyun > 0 && sumMay <= 0
                  });
                  newPaymentsCount++;
                }
              }
            } else {
              // --- UNIVERSAL FORMAT: STANDART SHABLON, AVGUST, IYUL, IYUN VA BARCHA OYLAR ---
              const hRow = pRows[headerRowIdx] || [];
              const subHRow = pRows[headerRowIdx + 1] || [];
              
              let colName = -1;
              let colParentPhone = -1;
              let colStudentPhone = -1;
              let colGenericPhone = -1;
              let colGroup = -1;
              let colOylik = -1;
              let colNaqd1 = -1;
              let colClick1 = -1;
              let colDate1 = -1;
              let colNaqd2 = -1;
              let colClick2 = -1;
              let colDate2 = -1;
              let colQoldiq = -1;
              let colIzoh = -1;

              const totalCols = Math.max(hRow.length, subHRow.length, 16);

              for (let c = 0; c < totalCols; c++) {
                const hText = `${hRow[c] || ''} ${subHRow[c] || ''}`.toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim();
                if (!hText) continue;

                if (hText.includes('i.f.o') || hText.includes('f.i.o') || hText.includes("o'quvchi") || hText.includes('oquvchi') || hText.includes('talaba') || (hText.includes('ism') && !hText.includes("ta'sischi") && !hText.includes('tasischi') && !hText.includes('xodim') && !hText.includes('ustoz'))) {
                  if (colName === -1) colName = c;
                }
                else if (hText.includes('oila') || hText.includes('ota-ona') || hText.includes('ota ona') || hText.includes('parent')) {
                  if (colParentPhone === -1) colParentPhone = c;
                }
                else if (hText.includes("o'ziniki") || hText.includes('oziniki') || hText.includes('talaba tel') || hText.includes('student tel')) {
                  if (colStudentPhone === -1) colStudentPhone = c;
                }
                else if (hText.includes('telefon') || hText.includes('tel') || hText.includes('phone') || hText.includes('aloqa')) {
                  if (colGenericPhone === -1) colGenericPhone = c;
                }
                else if (hText.includes('guruh') || hText.includes('gurux') || hText.includes("yo'nalish") || hText.includes('yonalish') || hText.includes("yo`nalish") || hText.includes('kurs') || hText.includes('class')) {
                  if (colGroup === -1) colGroup = c;
                }
                else if (hText.includes("oylik to'lov") || hText.includes('oylik tolov') || hText.includes("oylik to`lov") || hText.includes('kontrakt') || hText.includes('narx') || hText.includes('tarif')) {
                  if (colOylik === -1) colOylik = c;
                }
                else if (hText.includes('2-to') || hText.includes('2 to') || hText.includes('2-naqd') || hText.includes('2-naxt') || hText.includes('2 tolov')) {
                  if (hText.includes('click') || hText.includes('clisk') || hText.includes('karta')) colClick2 = c;
                  else if (hText.includes('sana') || hText.includes('date')) colDate2 = c;
                  else colNaqd2 = c;
                }
                else if (hText.includes('1-to') || hText.includes('1 to') || hText.includes('1-naqd') || hText.includes('1-naxt') || hText.includes('1 tolov')) {
                  if (hText.includes('click') || hText.includes('clisk') || hText.includes('karta')) colClick1 = c;
                  else if (hText.includes('sana') || hText.includes('date')) colDate1 = c;
                  else colNaqd1 = c;
                }
                else if (hText.includes('naqd') || hText.includes('naxt')) {
                  if (colNaqd1 === -1) colNaqd1 = c;
                }
                else if (hText.includes('click') || hText.includes('clisk') || hText.includes('karta') || hText.includes('humo') || hText.includes('uzcard')) {
                  if (colClick1 === -1) colClick1 = c;
                }
                else if (hText.includes('sana') || hText.includes('date')) {
                  if (colDate1 === -1) colDate1 = c;
                }
                else if (hText.includes('qoldiq') || hText.includes('qarz') || hText.includes('debt') || hText.includes('balance')) {
                  if (colQoldiq === -1) colQoldiq = c;
                }
                else if (hText.includes('izoh') || hText.includes('izox') || hText.includes('komment') || hText.includes('tavsif') || hText.includes('note')) {
                  if (colIzoh === -1) colIzoh = c;
                }
              }

              // Fallback column indexing if headers were missing or minimal
              if (colName === -1) {
                const fH = String(hRow[0] || '').toLowerCase();
                if (fH.includes('№') || fH.includes('t/r') || fH.includes('tr') || fH.includes('no') || /^\d+$/.test(fH)) colName = 1;
                else colName = 0;
              }
              if (colStudentPhone === -1 && colGenericPhone !== -1) {
                if (colParentPhone === -1) colStudentPhone = colGenericPhone;
                else colStudentPhone = colGenericPhone;
              }

              const rowDataStart = (subHRow.some(c => String(c).toLowerCase().includes('naxt') || String(c).toLowerCase().includes('clisk') || String(c).toLowerCase().includes('click') || String(c).toLowerCase().includes('naqd'))) 
                ? headerRowIdx + 2 
                : headerRowIdx + 1;

              let isDroppedMode = false;
              droppedStudentsCount = 0;

              for (let i = rowDataStart; i < pRows.length; i++) {
                const row = pRows[i];
                if (!row || row.length === 0) continue;

                const rowFullText = row.map(c => String(c || '')).join(' ').toLowerCase().replace(/[`'ʻ’ʼ]/g, "'");

                // Chiqib ketgan o'quvchilar bloki boshlanishi
                if (rowFullText.includes('chiqib ketgan') || rowFullText.includes('ketganlar') || rowFullText.includes('tark etgan')) {
                  isDroppedMode = true;
                  continue;
                }

                // Chiqib ketgan o'quvchini qayta ishlash
                if (isDroppedMode) {
                  let rawName = String(row[1] || row[0] || '').trim();
                  if (/^\d+$/.test(rawName) && row[1]) {
                    rawName = String(row[1]).trim();
                  }
                  if (!rawName || /^\d+$/.test(rawName) || rawName.toLowerCase().startsWith('№') || rawName.toLowerCase().startsWith('o\'quvchi') || rawName.toLowerCase().startsWith('jami') || rawName.length < 3) {
                    continue;
                  }

                  let droppedGroup = '';
                  for (let c = 2; c < row.length; c++) {
                    const val = String(row[c] || '').trim();
                    if (val && !/^\+?\d+$/.test(val) && isNaN(Number(val)) && val.length >= 2 && !val.toLowerCase().startsWith('chiqib')) {
                      droppedGroup = val;
                    }
                  }
                  const cleanGrp = droppedGroup ? cleanGroupName(droppedGroup) : 'Asosiy guruh';

                  let existingStudent = updatedStudents.find(s => isNameMatch(s.name, rawName));
                  if (existingStudent) {
                    existingStudent.status = 'inactive';
                    if (cleanGrp && cleanGrp !== 'Asosiy guruh') {
                      existingStudent.group = cleanGrp;
                    }
                  } else {
                    existingStudent = {
                      id: generateStudentId(),
                      name: formatProperName(rawName),
                      phone: '+998 ',
                      parentPhone: '+998 ',
                      group: cleanGrp,
                      monthlyFee: 0,
                      status: 'inactive',
                      joinedDate: getTodayInputFormat()
                    };
                    updatedStudents.push(existingStudent);
                    newStudentsCount++;
                  }
                  droppedStudentsCount++;

                  if (cleanGrp && cleanGrp !== 'Asosiy guruh' && !updatedGroups.some(g => cleanGroupName(g.name).toLowerCase() === cleanGrp.toLowerCase())) {
                    updatedGroups.push({
                      id: makeGrpId(),
                      name: cleanGrp,
                      category: 'Dasturlash',
                      fee: 750000,
                      teacher: 'Asosiy Ustoz',
                      days: 'Dush-Chor-Jum (14:00)',
                      room: '1-Xona'
                    });
                  }
                  continue;
                }

                let rawName = String(row[colName] || '').trim();
                if (/^\d+$/.test(rawName) && row[colName + 1] && typeof row[colName + 1] === 'string' && !/^\d+$/.test(String(row[colName + 1]).trim())) {
                  rawName = String(row[colName + 1]).trim();
                }
                if (!rawName || rawName.toLowerCase().startsWith('jami') || rawName.toLowerCase().startsWith('total') || rawName.toLowerCase().startsWith('hisobot') || rawName.toLowerCase().startsWith('olingan') || rawName.toLowerCase().startsWith('i.f.o') || rawName.toLowerCase().startsWith('o\'quvchi')) {
                  continue;
                }

                // Jadval ostidagi hisob-kitoblar / ustozlar oyligi qismini to'xtatish
                if (rowFullText.includes('olingan to`lov') || rowFullText.includes("olingan to'lov") || rowFullText.includes('olishi kerak') || row[2] === 0.17 || row[1] === 0.17) {
                  break;
                }

                const norm = normalizeName(rawName);
                const manOlmaganman = isNotReceivedText(rowFullText);

                const parentPhone = (colParentPhone !== -1 && row[colParentPhone]) 
                  ? formatUzbekPhone(row[colParentPhone]) 
                  : '+998 ';
                const studentPhone = (colStudentPhone !== -1 && row[colStudentPhone]) 
                  ? formatUzbekPhone(row[colStudentPhone]) 
                  : (colGenericPhone !== -1 && row[colGenericPhone] ? formatUzbekPhone(row[colGenericPhone]) : '+998 ');

                const rawOylik = (colOylik !== -1) ? parseUzbekMoney(row[colOylik]) : 0;
                let oylikTolov = rawOylik > 0 ? rawOylik : 750000;

                let naqd = (colNaqd1 !== -1) ? parseUzbekMoney(row[colNaqd1]) : 0;
                let click = (colClick1 !== -1) ? parseUzbekMoney(row[colClick1]) : 0;
                let naqd2 = (colNaqd2 !== -1) ? parseUzbekMoney(row[colNaqd2]) : 0;
                let click2 = (colClick2 !== -1) ? parseUzbekMoney(row[colClick2]) : 0;

                if (manOlmaganman) {
                  naqd = 0;
                  click = 0;
                  naqd2 = 0;
                  click2 = 0;
                  manOlmaganmanCount++;
                }

                // Guruhni tozalash va normalizatsiya qilish
                const rawGroup = (colGroup !== -1 && row[colGroup]) ? String(row[colGroup]).trim() : '';
                const guruh = cleanGroupName(rawGroup);

                // Sanalar va Izohlar
                let rawDate1 = colDate1 !== -1 ? row[colDate1] : '';
                let rawDate2 = colDate2 !== -1 ? row[colDate2] : '';
                let izoh = colIzoh !== -1 ? String(row[colIzoh] || '').trim() : '';

                if (manOlmaganman) izoh = izoh ? izoh + " (Man olmaganman)" : "Man olmaganman";
                const dateVal = parseExcelDateInBrowser(rawDate1) || getTodayInputFormat();
                const dateVal2 = parseExcelDateInBrowser(rawDate2) || '';
                const totalPaidThisRow = naqd + click + naqd2 + click2;
                const is3Month = (totalPaidThisRow >= oylikTolov * 2) || rowFullText.toLowerCase().includes('3 oylik') || izoh.toLowerCase().includes('3 oylik');

                // 1. TALABA DEDUKLIKATSIYASI (Student deduplication)
                let existingStudent = updatedStudents.find(s => isNameMatch(s.name, rawName) || (studentPhone && studentPhone.length > 8 && s.phone && s.phone.includes(studentPhone.replace(/\D/g, ''))));
                if (!existingStudent) {
                  existingStudent = {
                    id: generateStudentId(),
                    name: formatProperName(rawName),
                    phone: studentPhone,
                    parentPhone: parentPhone,
                    group: guruh,
                    monthlyFee: oylikTolov,
                    status: 'active',
                    joinedDate: dateVal
                  };
                  updatedStudents.push(existingStudent);
                  newStudentsCount++;
                } else {
                  matchedStudentsCount++;
                  // Yetishmayotgan telefon yoki guruh ma'lumotlarini to'ldirish
                  if ((!existingStudent.phone || existingStudent.phone === '+998 ' || existingStudent.phone.length < 8) && studentPhone && studentPhone.length >= 8) {
                    existingStudent.phone = studentPhone;
                  }
                  if ((!existingStudent.parentPhone || existingStudent.parentPhone === '+998 ' || existingStudent.parentPhone.length < 8) && parentPhone && parentPhone.length >= 8) {
                    existingStudent.parentPhone = parentPhone;
                  }
                  if (guruh && guruh !== 'Asosiy guruh' && (!existingStudent.group || existingStudent.group === 'Asosiy guruh')) {
                    existingStudent.group = guruh;
                  }
                  if (oylikTolov > 0 && (!existingStudent.monthlyFee || existingStudent.monthlyFee === 0)) {
                    existingStudent.monthlyFee = oylikTolov;
                  }
                }

                // 2. GURUH DEDUPLIKATSIYASI
                if (guruh && guruh !== 'Asosiy guruh' && !updatedGroups.some(g => cleanGroupName(g.name).toLowerCase() === guruh.toLowerCase())) {
                  updatedGroups.push({
                    id: makeGrpId(),
                    name: guruh,
                    category: 'Dasturlash',
                    fee: oylikTolov,
                    teacher: 'Asosiy Ustoz',
                    days: 'Dush-Chor-Jum (14:00)',
                    room: '1-Xona'
                  });
                }

                totalImportedIncome += totalPaidThisRow;

                // 3. TO'LOV DEDUPLIKATSIYASI VA 1-TO'LOV / 2-TO'LOVNI BIRLASHTIRISH
                // (Bitta student 2 yoki 3 marta to'lov qilgan bo'lsa, hammasi bitta yozuvda 1-to'lov, 2-to'lov ichiga yoziladi!)
                let existingPay = updatedPayments.find(p => p.month === targetMonth && (p.studentId === existingStudent.id || normalizeName(p.studentName) === norm));
                if (existingPay) {
                  // Ushbu oyda oldin to'lovi bor: 2-to'lov sifatida kiritamiz
                  if (Number(existingPay.naqd2 || 0) === 0 && Number(existingPay.click2 || 0) === 0 && !existingPay.paymentDate2) {
                    existingPay.naqd2 = naqd + naqd2;
                    existingPay.click2 = click + click2;
                    existingPay.paymentDate2 = dateVal2 || dateVal;
                  } else {
                    // 3-to'lov yoki undan ko'p: 2-to'lovga jamlaymiz
                    existingPay.naqd2 = Number(existingPay.naqd2 || 0) + naqd + naqd2;
                    existingPay.click2 = Number(existingPay.click2 || 0) + click + click2;
                    if (dateVal && !String(existingPay.paymentDate2 || '').includes(dateVal)) {
                      existingPay.paymentDate2 = existingPay.paymentDate2 ? `${existingPay.paymentDate2}, ${dateVal}` : dateVal;
                    }
                  }

                  if (izoh && !existingPay.note.includes(izoh)) {
                    existingPay.note = existingPay.note ? `${existingPay.note}; ${izoh}` : izoh;
                  }

                  if (existingPay.phoneStudent === '+998 ' && studentPhone !== '+998 ') existingPay.phoneStudent = studentPhone;
                  if (existingPay.phoneParent === '+998 ' && parentPhone !== '+998 ') existingPay.phoneParent = parentPhone;
                  if (existingPay.group === 'Asosiy guruh' && guruh !== 'Asosiy guruh') existingPay.group = guruh;

                  const totalPaidAccum = Number(existingPay.naqd || 0) + Number(existingPay.click || 0) + Number(existingPay.naqd2 || 0) + Number(existingPay.click2 || 0);
                  if (is3Month || existingPay.is3MonthPayment || totalPaidAccum >= existingPay.oylikTolov * 2) {
                    existingPay.is3MonthPayment = true;
                    existingPay.paymentType = "3 Oylik (To'liq)";
                    existingPay.bittaToliqSumma = totalPaidAccum;
                    existingPay.depozitBalansi = Math.max(0, totalPaidAccum - existingPay.oylikTolov);
                  } else if (Number(existingPay.naqd2 || 0) > 0 || Number(existingPay.click2 || 0) > 0) {
                    existingPay.paymentType = totalPaidAccum >= existingPay.oylikTolov ? "To'liq (2x to'lov)" : "Qisman (2x to'lov)";
                  }
                } else {
                  // Yangi oylik to'lov yozuvi
                  let paymentType = 'Kutilmoqda';
                  if (is3Month) paymentType = "3 Oylik (To'liq)";
                  else if ((naqd2 > 0 || click2 > 0) && totalPaidThisRow >= oylikTolov) paymentType = "To'liq (2x to'lov)";
                  else if (naqd2 > 0 || click2 > 0) paymentType = "Qisman (2x to'lov)";
                  else if (naqd > 0 && click > 0) paymentType = 'Click + Naqd';
                  else if (click > 0) paymentType = 'Click';
                  else if (naqd > 0) paymentType = 'Naqd';

                  if (totalPaidThisRow < oylikTolov && !is3Month) {
                    debtorsCount++;
                  }

                  updatedPayments.push({
                    id: makePayId(),
                    studentId: existingStudent.id,
                    studentName: existingStudent.name,
                    phoneStudent: studentPhone,
                    phoneParent: parentPhone,
                    oylikTolov,
                    naqd,
                    click,
                    paymentDate: dateVal,
                    naqd2,
                    click2,
                    paymentDate2: dateVal2,
                    group: guruh,
                    month: targetMonth,
                    paymentType,
                    note: izoh,
                    is3MonthPayment: is3Month,
                    bittaToliqSumma: is3Month ? totalPaidThisRow : 0,
                    depozitBalansi: is3Month ? Math.max(0, totalPaidThisRow - oylikTolov) : 0,
                    isPrepaid: false
                  });
                  newPaymentsCount++;
                }
              }
            }
          }

          // C) Chiqim modullari: Xodimlar, Markaz va Founder xarajatlari
          // ===================================================================
          const isStandardOrModular = Boolean(salarySheet || founderExpSheet || centerExpSheet);

          // 1. O'QITUVCHILAR VA XODIMLAR OYLIGI VARAG'I (Salary Sheet)
          if (salarySheet) {
            const sRows = window.XLSX.utils.sheet_to_json(salarySheet, { header: 1, raw: false });
            let sHeaderIdx = -1;
            let colStaffName = 1;
            let colRole = 2;
            let colStavka = 3;
            let colFoiz = 4;
            let colAvans = 5;
            let colQarz = 6;
            let colOshxona = 7;
            let colJami = 8;
            let colSana = 9;
            let colIzoh = 10;

            for (let r = 0; r < Math.min(sRows.length, 6); r++) {
              const row = (sRows[r] || []).map(c => String(c || '').toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim());
              if (row.some(c => c.includes('xodim') || c.includes('f.i.o') || c.includes('ustoz') || c.includes('maosh') || c.includes('stavka'))) {
                sHeaderIdx = r;
                row.forEach((cell, idx) => {
                  if (cell.includes('xodim') || cell.includes('f.i.o') || cell.includes('ism') || cell.includes('ustoz')) colStaffName = idx;
                  else if (cell.includes('lavozim') || cell.includes("yo'nalish")) colRole = idx;
                  else if (cell.includes('stavka') || cell.includes('asosiy') || (cell.includes('oylik') && !cell.includes("qo'lga"))) colStavka = idx;
                  else if (cell.includes('ulush') || cell.includes('foiz')) colFoiz = idx;
                  else if (cell.includes('avans')) colAvans = idx;
                  else if (cell.includes('qarz') || cell.includes('oldingi')) colQarz = idx;
                  else if (cell.includes('oshxona') || cell.includes('tushlik')) colOshxona = idx;
                  else if (cell.includes("qo'lga") || cell.includes('jami') || cell.includes('olishi') || cell.includes('tegadigan')) colJami = idx;
                  else if (cell.includes('sana')) colSana = idx;
                  else if (cell.includes('izoh') || cell.includes('tafsilot')) colIzoh = idx;
                });
                break;
              }
            }

            const sStart = sHeaderIdx >= 0 ? sHeaderIdx + 1 : 1;
            for (let i = sStart; i < sRows.length; i++) {
              const r = sRows[i];
              if (!r || r.length === 0) continue;

              let rawName = String(r[colStaffName] || '').trim();
              if ((/^\d+$/.test(rawName) || !rawName) && r[colStaffName + 1]) {
                rawName = String(r[colStaffName + 1]).trim();
              }
              if (!rawName || rawName.toLowerCase().startsWith('jami') || rawName.toLowerCase().startsWith('total') || rawName.toLowerCase().startsWith('xodim') || rawName.length < 3) continue;

              const roleStr = String(r[colRole] || (rawName.toLowerCase().includes('direktor') ? 'Direktor' : 'Ustoz')).trim();
              const stavka = parseUzbekMoney(r[colStavka]);
              const rawFoiz = String(r[colFoiz] || '');
              let foizVal = rawFoiz.includes('%') ? parseFloat(rawFoiz.replace('%', '')) : (parseFloat(rawFoiz) > 0 && parseFloat(rawFoiz) < 1 ? parseFloat(rawFoiz) * 100 : parseFloat(rawFoiz) || 0);
              const avans = parseUzbekMoney(r[colAvans]);
              const qarz = parseUzbekMoney(r[colQarz]);
              let oshxona = parseUzbekMoney(r[colOshxona]);
              const normStaff = normalizeName(rawName);
              if (oshxona === 0 && kitchenTotals[normStaff]) {
                oshxona = kitchenTotals[normStaff];
              }
              let jami = parseUzbekMoney(r[colJami]);
              if (jami === 0 && (stavka > 0 || avans > 0)) {
                jami = Math.max(0, stavka + qarz - avans - oshxona);
              }
              const sanaRaw = r[colSana];
              const dateVal = parseExcelDateInBrowser(sanaRaw) || getTodayInputFormat();
              const izoh = String(r[colIzoh] || '').trim();

              // Xodimlarni bazaga yangilash / qo'shish
              let staffObj = updatedStaff.find(s => normalizeName(s.name) === normStaff);
              if (!staffObj) {
                staffObj = {
                  id: makeStfId(),
                  name: formatProperName(rawName),
                  phone: '+998 ',
                  role: roleStr.toLowerCase().includes('direktor') || roleStr.toLowerCase().includes('admin') || roleStr.toLowerCase().includes('farrosh') || roleStr.toLowerCase().includes('xodim') ? 'staff' : 'teacher',
                  position: roleStr,
                  percent: foizVal > 0 ? foizVal : 40,
                  fixedSalary: stavka > 0 ? stavka : 0,
                  joinedDate: getTodayInputFormat(),
                  status: 'active'
                };
                updatedStaff.push(staffObj);
                newStaffCount++;
              } else {
                if (stavka > 0) staffObj.fixedSalary = stavka;
                if (roleStr) staffObj.position = roleStr;
                if (foizVal > 0) staffObj.percent = foizVal;
              }

              const payAmount = jami > 0 ? jami : (avans > 0 ? avans : stavka);
              if (payAmount > 0) {
                let desc = `Xodim maoshi: ${staffObj.name}`;
                const details = [];
                if (avans > 0) details.push(`Avans: -${formatMoney(avans)}`);
                if (oshxona > 0) details.push(`Oshxona: -${formatMoney(oshxona)}`);
                if (qarz !== 0) details.push(`Qarz: ${formatMoney(qarz)}`);
                if (details.length > 0) desc += ` (${details.join(', ')})`;
                if (izoh) desc += ` [${izoh}]`;

                updatedExpenses.push({
                  id: makeExpId(),
                  category: roleStr.toLowerCase().includes('direktor') || roleStr.toLowerCase().includes('admin') || roleStr.toLowerCase().includes('xodim') || roleStr.toLowerCase().includes('farrosh') ? 'Xodimlar oyligi' : "O'qituvchilar oyligi",
                  description: desc,
                  amount: payAmount,
                  recipient: staffObj.name,
                  date: dateVal,
                  month: targetMonth,
                  type: 'Kadrlar'
                });
                totalImportedExpense += payAmount;
                newExpensesCount++;
              }
            }
          }

          // 2. MARKAZ OPERATSION XARAJATLARI VARAG'I (Center Expenses Sheet)
          const targetCenterSheet = centerExpSheet || (isStandardOrModular ? expensesSheet : null);
          if (targetCenterSheet) {
            const cRows = window.XLSX.utils.sheet_to_json(targetCenterSheet, { header: 1, raw: false });
            let cHeaderIdx = -1;
            let colCSana = 1;
            let colCKat = 2;
            let colCKimga = -1;
            let colCIzoh = 3;
            let colCSumma = -1;
            let colCOldingi = -1;
            let colCShu = -1;
            let colCKeyingi = -1;
            let colCTur = -1;

            for (let r = 0; r < Math.min(cRows.length, 6); r++) {
              const row = (cRows[r] || []).map(c => String(c || '').toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim());
              if (row.some(c => c.includes('kategoriya') || c.includes('kimga') || c.includes('qayerga') || c.includes('summa') || c.includes('xarajat') || c.includes('oldingi') || c.includes('shu oy'))) {
                cHeaderIdx = r;
                row.forEach((cell, idx) => {
                  if (cell.includes('sana')) colCSana = idx;
                  else if (cell.includes('kategoriya')) colCKat = idx;
                  else if (cell.includes('kimga') || cell.includes('qayerga')) colCKimga = idx;
                  else if (cell.includes('izoh') || cell.includes('tavsif') || cell.includes('nima') || cell.includes('uchun')) colCIzoh = idx;
                  else if (cell.includes('oldingi')) colCOldingi = idx;
                  else if (cell.includes('shu oy') || (cell.includes('shu') && cell.includes('uchun')) || cell.includes('joriy')) colCShu = idx;
                  else if (cell.includes('keyingi')) colCKeyingi = idx;
                  else if (cell.includes('summa') || cell.includes('narx') || cell.includes('miqdor')) colCSumma = idx;
                  else if (cell.includes('turi') || cell.includes('tur')) colCTur = idx;
                });
                break;
              }
            }

            const cStart = cHeaderIdx >= 0 ? cHeaderIdx + 1 : 1;
            for (let i = cStart; i < cRows.length; i++) {
              const r = cRows[i];
              if (!r || r.length === 0) continue;

              const valOldingi = colCOldingi >= 0 ? parseUzbekMoney(r[colCOldingi]) : 0;
              const valShu = colCShu >= 0 ? parseUzbekMoney(r[colCShu]) : 0;
              const valKeyingi = colCKeyingi >= 0 ? parseUzbekMoney(r[colCKeyingi]) : 0;

              if (valOldingi > 0 || valShu > 0 || valKeyingi > 0) {

              } else if (colCSumma >= 0) {

                sumVal = parseUzbekMoney(r[4] || r[5] || r[6] || r[3]);

              if (sumVal <= 0) continue;

              const rawKimga = colCKimga >= 0 ? String(r[colCKimga] || '').trim() : '';

              const rawSana = colCSana >= 0 ? r[colCSana] : null;
              const dateVal = parseExcelDateInBrowser(rawSana) || getTodayInputFormat();
              const turStr = colCTur >= 0 ? String(r[colCTur] || 'Naqd').toLowerCase() : 'naqd';
              const isClick = turStr.includes('click') || turStr.includes('karta');

              const kimgaText = rawKimga || rawKat || 'Markaz xarajati';
              
              let breakdownParts = [];
              if (valOldingi > 0) breakdownParts.push(`Oldingi oy uchun: ${formatMoney(valOldingi)}`);
              if (valShu > 0 && (valOldingi > 0 || valKeyingi > 0)) breakdownParts.push(`Shu oy uchun: ${formatMoney(valShu)}`);
              if (valKeyingi > 0) breakdownParts.push(`Keyingi oy uchun: ${formatMoney(valKeyingi)}`);

              let descText = rawIzoh ? `${kimgaText} - ${rawIzoh}` : kimgaText;

                descText += ` (${breakdownParts.join(', ')})`;

              updatedExpenses.push({
                id: makeExpId(),

                amount: sumVal,

              });

          // 3. FOUNDER XARAJATLARI VARAG'I (Founder Expenses Sheet)
          if (founderExpSheet) {
            const fRows = window.XLSX.utils.sheet_to_json(founderExpSheet, { header: 1, raw: false });
            let fHeaderIdx = -1;
            let colFSana = 1;
            let colFIsm = 2;
            let colFMaqsad = 3;
            let colFIzoh = 4;
            let colFSumma = 5;
            let colFTur = 6;

            for (let r = 0; r < Math.min(fRows.length, 6); r++) {
              const row = (fRows[r] || []).map(c => String(c || '').toLowerCase().replace(/[`'ʻ’ʼ]/g, "'").trim());
              if (row.some(c => c.includes("ta'sischi") || c.includes('tasischi') || c.includes('founder') || c.includes('maqsad') || c.includes('summa'))) {
                fHeaderIdx = r;
                row.forEach((cell, idx) => {
                  if (cell.includes('sana')) colFSana = idx;
                  else if (cell.includes("ta'sischi") || cell.includes('tasischi') || cell.includes('founder') || cell.includes('ism') || cell.includes('kimga')) colFIsm = idx;
                  else if (cell.includes('maqsad') || cell.includes('kategoriya')) colFMaqsad = idx;
                  else if (cell.includes('izoh') || cell.includes('tafsilot')) colFIzoh = idx;
                  else if (cell.includes('summa') || cell.includes('miqdor')) colFSumma = idx;
                  else if (cell.includes('tur')) colFTur = idx;
                });
                break;
              }
            }

            const fStart = fHeaderIdx >= 0 ? fHeaderIdx + 1 : 1;
            for (let i = fStart; i < fRows.length; i++) {
              const r = fRows[i];
              if (!r || r.length === 0) continue;
              const sumVal = parseUzbekMoney(r[colFSumma]);
              if (sumVal <= 0) continue;

              const rawIsm = String(r[colFIsm] || '').trim();
              if (rawIsm.toLowerCase().startsWith('jami') || rawIsm.toLowerCase().startsWith('total')) continue;
              const rawMaqsad = String(r[colFMaqsad] || '').trim();
              const rawIzoh = String(r[colFIzoh] || '').trim();
              const rawSana = r[colFSana];
              const dateVal = parseExcelDateInBrowser(rawSana) || getTodayInputFormat();
              const turStr = String(r[colFTur] || 'Naqd').toLowerCase();
              const isClick = turStr.includes('click') || turStr.includes('karta');

              const ismText = rawIsm || 'Founder';
              const descText = rawIzoh || rawMaqsad ? `${ismText} - ${rawIzoh || rawMaqsad}` : `Founder xarajati: ${ismText}`;

              updatedExpenses.push({
                id: makeExpId(),
                category: 'Founder xarajatlari',
                description: descText,
                amount: sumVal,
                recipient: ismText,
                date: dateVal,
                month: targetMonth,
                type: 'Founder'
              });
              totalImportedExpense += sumVal;
              newExpensesCount++;
            }
          }

          // 4. ESKI / LEGACY FORMAT (May oyi yoki yonma-yon side-by-side format)
          if (!isStandardOrModular && expensesSheet) {
            const eRows = window.XLSX.utils.sheet_to_json(expensesSheet, { header: 1, raw: false });
            const isMayRasxod = fileName.toLowerCase().includes('may') || (legacyExpSheetName && legacyExpSheetName.toLowerCase().includes('rasxod'));

            if (isMayRasxod) {
              // --- MAY OYI RASXOD FORMATI (Chiqim: Aprel oyligi uchun + May oyi xarajatlari) ---
              for (let i = 4; i < eRows.length; i++) {
                const r = eRows[i];
                if (!r || r.length === 0) continue;

                const sanaRaw = r[0];
                const kimgaRaw = String(r[1] || '').trim();
                const sababRaw = String(r[2] || '').trim();
                const izoxRaw = String(r[3] || '').trim();
                const valAprel = parseUzbekMoney(r[4]);
                const valMay = parseUzbekMoney(r[5]);
                const summa = valAprel + valMay;
                if (summa <= 0) continue;

                const turRaw = String(r[6] || 'Naqd').toLowerCase();
                const isClick = turRaw.includes('click') || turRaw.includes('karta');
                const dateVal = parseExcelDateInBrowser(sanaRaw) || getTodayInputFormat();

                const fullText = `${kimgaRaw} ${sababRaw} ${izoxRaw}`.toLowerCase();

                let expType = 'Markaz';
                let category = 'Boshqa operatsion';
                let recipient = kimgaRaw;

                // 1. Founder xarajatlari
                if (fullText.includes('founder') || fullText.includes('shahrixon') || fullText.includes("ta'sischi") || fullText.includes('tasischi')) {
                  expType = 'Founder';
                  category = 'Founder xarajatlari';
                  recipient = kimgaRaw && kimgaRaw.toLowerCase() !== 'none' ? kimgaRaw : 'Raxmatullayev Shahrixon';

                // 2. Kadrlar & Ustozlar oyligi / Avans
                else if (fullText.includes('oylik') || fullText.includes('avans') || fullText.includes('akademic') || 
                         ['sardor', 'madamin', 'jaxongir', 'nazirqulov', "g'olib", 'elnur', 'jasmina', 'umid mobilograf'].some(t => fullText.includes(t))) {

                  const words = izoxRaw.split(/\s+/).filter(Boolean);
                  recipient = (kimgaRaw && kimgaRaw.toLowerCase() !== 'none') ? kimgaRaw : (words.length > 0 ? words.slice(0, 2).join(' ') : 'Ustoz / Xodim');

                  // Xodim profiliga ham qo'shish
                  const normStaff = normalizeName(recipient);
                  let staffObj = updatedStaff.find(s => normalizeName(s.name) === normStaff);
                  if (!staffObj && recipient.length > 3) {
                    staffObj = {
                      id: makeStfId(),
                      name: formatProperName(recipient),
